<svg xmlns="http://www.w3.org/2000/svg" width="840" height="600" viewBox="0 0 840 600" role="img" aria-labelledby="title desc">
<title id="title">One vLLM engine step: CPU bookkeeping and GPU model work</title>
<desc id="desc">The scheduler chooses token positions and calls the KV manager for block metadata. The executor passes the plan to model workers. Workers compute model outputs and write KV tensors. Results return to the scheduler. This is an illustrative ownership map, not a timing trace.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#475569"/></marker></defs>
<style>
text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#172536}
.title{font-size:25px;font-weight:700}.sub{font-size:15px;fill:#526174}
.zone{font-size:14px;font-weight:700;letter-spacing:1px;fill:#526174}
.name{font-size:19px;font-weight:700}.body{font-size:16px;fill:#475569}
.label{font-size:13px;fill:#475569}.step{font-size:16px;font-weight:600}
.arrow{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#arrow)}
</style>
<rect width="840" height="600" rx="16" fill="white"/>
<text x="28" y="42" class="title">One vLLM engine step</text>
<text x="28" y="69" class="sub">Choose the work on CPU. Compute model outputs and KV on the worker.</text>
<rect x="28" y="89" width="784" height="51" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="46" y="120" class="body">Input: request tokens + prior request state</text>
<text x="462" y="120" class="body">Output: updated state + results</text>
<text x="30" y="172" class="zone">CPU · SCHEDULING AND OWNERSHIP</text>
<text x="478" y="172" class="zone">WORKER · MODEL EXECUTION</text>
<rect x="28" y="185" width="372" height="293" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="472" y="185" width="340" height="293" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="46" y="211" width="336" height="102" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="64" y="243" class="name">Scheduler</text>
<text x="64" y="272" class="body">Choose positions within token budgets.</text>
<text x="64" y="296" class="body">Apply results to each request.</text>
<rect x="46" y="365" width="336" height="94" rx="12" fill="white" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="64" y="396" class="name">KV cache manager</text>
<text x="64" y="422" class="body">Attach reused blocks; reserve new ones.</text>
<text x="64" y="446" class="body">Track block IDs and references.</text>
<path d="M110 313 V365" class="arrow"/><text x="126" y="343" class="label">lookup / allocate</text>
<path d="M340 365 V313" class="arrow"/>
<rect x="492" y="211" width="300" height="102" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="510" y="243" class="name">Model worker</text>
<text x="510" y="272" class="body">Run the selected token positions.</text>
<text x="510" y="296" class="body">Return outputs through the executor.</text>
<rect x="492" y="365" width="300" height="94" rx="12" fill="#f3f8e9" stroke="#83a935" stroke-width="1.5"/>
<text x="510" y="396" class="name">KV tensors on device</text>
<text x="510" y="422" class="body">Store keys and values for positions.</text>
<text x="510" y="446" class="body">CPU block IDs refer to these pages.</text>
<path d="M642 313 V365" class="arrow"/><text x="656" y="343" class="label">write KV</text>
<path d="M382 252 H492" class="arrow"/><text x="437" y="236" class="label" text-anchor="middle">counts + IDs</text>
<path d="M492 285 H382" class="arrow"/><text x="437" y="308" class="label" text-anchor="middle">results</text>
<rect x="28" y="500" width="784" height="49" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="48" y="531" class="step">1  Schedule</text><path d="M181 525 H226" class="arrow"/>
<text x="248" y="531" class="step">2  Execute / sample</text><path d="M445 525 H490" class="arrow"/>
<text x="510" y="531" class="step">3  Update request state</text>
<text x="28" y="575" class="sub">Illustrative synchronous path. Arrows show calls or metadata, not timing or overlap.</text>
</svg>
