<script id="docs-data" type="application/json">[{"name": "index.md", "title": "vLLM V1: token budgets and KV blocks", "md": "# vLLM V1: token budgets and KV blocks\n\nThis deep walkthrough follows one dense, decoder-only request through the synchronous V1 scheduler and one full-attention cache group. It starts with token IDs already in a `Request`. It ends after prefill and two decode steps, at the model-execution boundary.\n\nCommit: `d29f7f5c9294be8e489dac34d45a939b95a06336`. Mode: `deep`. Audience: engineers reading the scheduler.\nSource: [vLLM at the explained commit](https://github.com/vllm-project/vllm/tree/d29f7f5c9294be8e489dac34d45a939b95a06336). Scope excludes HTTP transport, tokenizer internals, checkpoint loading and model architecture.\n\n## Contents\n\n- [Mental model](#mental-model)\n- [At a glance](#at-a-glance)\n- [Big picture](#big-picture)\n- [Running example](#running-example)\n- [Doc map](#doc-map)\n- [Major components](#major-components)\n- [Key sequences](#key-sequences)\n- [End-to-end data flow](#end-to-end-data-flow)\n- [Test coverage](#test-coverage)\n- [Gaps](#gaps)\n- [Glossary](#glossary)\n- [Shapes cheat sheet](#shapes-cheat-sheet)\n- [Coverage of existing docs](#coverage-of-existing-docs)\n- [Out of scope](#out-of-scope)\n- [Refreshing this doc](#refreshing-this-doc)\n\n## Mental model\n\nThe engine turns a request's token IDs into model work, then uses the result\nto advance that request. Think of the scheduler as a planner: it chooses the\nnext work, while the worker performs it.\n\n1. **Choose the next tokens.** The scheduler finds which known tokens still need work.\n2. **Get memory for them.** The KV manager attaches reusable blocks and reserves any new blocks. KV means the model's saved attention keys and values.\n3. **Run the plan.** The executor sends the chosen positions and block IDs to the model worker.\n4. **Update the request.** The scheduler records results. A generated token becomes input to a later step.\n\n**Small example (illustrative).** A 35-token prompt with no saved prefix needs\nchunks of 16, 16 and 3 tokens under this budget. With 32 matching tokens already\ncomputed and cached, only the final 3 need model work. Both cases still need\nmemory covering all 35 input positions. Details below explain the bookkeeping\nand when saved values are ready to use.\n\n## At a glance\n\nAll values below are chosen for this illustrative example, not production defaults. `SchedulerConfig` in `vllm/config/scheduler.py` calls several field defaults testing conveniences; engine arguments can replace them.\n\n| Knob | Value | Set in | What it changes |\n|---|---:|---|---|\n| `max_num_scheduled_tokens` | 16 | `vllm/config/scheduler.py` | Compute tokens per schedule |\n| `max_num_batched_tokens` | 16 | `vllm/config/scheduler.py` | Input capacity per schedule |\n| `long_prefill_token_threshold` | 0 | `vllm/config/scheduler.py` | Disables the extra long-prefill cap |\n| `enable_chunked_prefill` | true | `vllm/config/scheduler.py` | Allows the prompt to span iterations |\n| `max_num_seqs` | 1 | `vllm/config/scheduler.py` | One active request in the trace |\n| `async_scheduling` | false | `vllm/config/scheduler.py` | Sequential example |\n| `block_size`, hash block size | 16, 16 | Selected cache spec and manager input | Whole-block reuse |\n| Pool size | 11 total, 10 usable | `BlockPool` in `vllm/v1/core/block_pool.py` | Block 0 is the null placeholder |\n| `max_model_len` | 128 | Model config input | Maximum positions, not measured memory |\n\n## Big picture\n\n![One engine step: CPU scheduling and worker model execution](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI4NDAiIGhlaWdodD0iNjAwIiB2aWV3Qm94PSIwIDAgODQwIDYwMCIgcm9sZT0iaW1nIiBhcmlhLWxhYmVsbGVkYnk9InRpdGxlIGRlc2MiPgo8dGl0bGUgaWQ9InRpdGxlIj5PbmUgdkxMTSBlbmdpbmUgc3RlcDogQ1BVIGJvb2trZWVwaW5nIGFuZCBHUFUgbW9kZWwgd29yazwvdGl0bGU+CjxkZXNjIGlkPSJkZXNjIj5UaGUgc2NoZWR1bGVyIGNob29zZXMgdG9rZW4gcG9zaXRpb25zIGFu ion dense model, such as the `facebook/opt-125m` scheduler test fixture, can motivate this path; the example does not load that checkpoint.\n\nBefore each schedule, `known` counts prompt plus sampled outputs. `computed` is the scheduler's current boundary after the previous synchronous iteration completed.\n\n| Scenario and step | known | computed before | scheduled now | computed after schedule | output appended after execution |\n|---|---:|---:|---:|---:|---|\n| Cold R: prefill chunk 1 | 35 | 0 | 16 | 16 | none |\n| Cold R: prefill chunk 2 | 35 | 16 | 16 | 32 | none |\n| Cold R: final prefill | 35 | 32 | 3 | 35 | 101 |\n| Cold R: decode 1 | 36 | 35 | 1 | 36 | 102 |\n| Cold R: decode 2 | 37 | 36 | 1 | 37 | 103 |\n| Warm R: final prefill | 35 | 32 from cache | 3 | 35 | 101 |\n| Warm R: decode 1 | 36 | 35 | 1 | 36 | 102 |\n| Warm R: decode 2 | 37 | 36 | 1 | 37 | 103 |\n\nCold and warm are alternative executions of the same request R. In the warm case a prior, completed request left matching blocks 1 and 2 idle in the cache. It is setup, not a simultaneous second request. The trace ends before R finishes, so its blocks remain referenced.\n\n## Doc map\n\n| Doc | Covers | Entry point | Read it when |\n|---|---|---|---|\n| [scheduler.md](scheduler.md) | Compute budgets and known/computed boundaries | `Scheduler.schedule` | Changing scheduling counts |\n| [kv-cache.md](kv-cache.md) | Prefix lookup, allocation and cache registration | `KVCacheManager.get_computed_blocks` | Changing KV capacity or reuse |\n| [Evidence ledger](explain.assets/evidence-1bc9e3c44e9658ea.json) | Source claims and verification boundaries | Persistent JSON | Revising or writing a companion article |\n| [CPU contracts](explain.assets/source_contracts-8c80800394624900.py) | Original AST methods with stand-ins | Standalone script | Rechecking toy numbers |\n\n## Major components\n\n| Component | Job in plain words | Receives / uses | Produces / changes | Source |\n|---|---|---|---|---|\n| `EngineCore` | Run one schedule, execute, and update cycle | Scheduler plan and executor result | Engine outputs and execution flag | `vllm/v1/engine/core.py` |\n| `Scheduler` | Choose token work, then advance requests | Request queues, budgets, model outputs | Token counts in the plan; updated request state | `vllm/v1/core/sched/scheduler.py` |\n| `KVCacheManager` | Give requests the blocks they need | Request positions and reusable prefix blocks | Hit metadata, allocated blocks, or allocation failure | `vllm/v1/core/kv_cache_manager.py` |\n| `UnitaryKVCacheCoordinator` | Delegate work for this one cache group | Group lookup and allocation operations | The group's block results | `vllm/v1/core/kv_cache_coordinator.py` |\n| `FullAttentionManager` | Find matching complete prefix blocks | Prefix hashes and lookup limits | Reusable block metadata | `vllm/v1/core/single_type_kv_cache_manager.py` |\n| `BlockPool` | Track shared and available block metadata | Block references, releases, and hashes | Reference counts, free queue, hash index | `vllm/v1/core/block_pool.py` |\n\n```mermaid\nclassDiagram\n    Scheduler *-- KVCacheManager\n    KVCacheManager *-- UnitaryKVCacheCoordinator\n    UnitaryKVCacheCoordinator *-- FullAttentionManager\n    FullAttentionManager --> BlockPool\n    EngineCore --> Scheduler\n```\n\n## Key sequences\n\n```mermaid\nsequenceDiagram\n    participant EC as EngineCore\n    participant S as Scheduler\n    participant K as KVCacheManager\n    participant X as Executor\n    EC->>S: schedule\n    S->>K: get_computed_blocks for new request\n    K-->>S: blocks, hit tokens, shared boundary\n    S->>K: allocate_slots for new suffix\n    K-->>S: new block metadata\n    S->>S: package output then advance computed boundary\n    S-->>EC: SchedulerOutput\n    EC->>X: execute_model\n    X-->>EC: model result or separate sampling result\n    EC->>S: update_from_output\n    S->>S: append sampled token IDs\n```\n\nThis is the synchronous `EngineCore.step` path. A call returning a future does not make the example an async scheduler run: `step` waits for its result.\n\n## End-to-end data flow\n\n| Step | Input | Output | Code | Doc |\n|---|---|---|---|---|\n| sched.A1 | Known and computed positions | R schedules 16, 16, 3, 1, 1 on a miss | `Scheduler.schedule` | [scheduler.md](scheduler.md) |\n| kv.A1 | R hashes and warm index | 32 reusable tokens, blocks 1 and 2 | `KVCacheManager.get_computed_blocks` | [kv-cache.md](kv-cache.md) |\n| kv.A2 | Reused prefix plus 3 new tokens | 3 logical blocks, 1 newly allocated | `KVCacheManager.allocate_slots` | [kv-cache.md](kv-cache.md) |\n| kv.A3 | Scheduled finalized token boundary | Full-block hash metadata registers before execution | `SingleTypeKVCacheManager.cache_blocks` | [kv-cache.md](kv-cache.md) |\n| sched.A2 | Scheduled positions and sampled IDs | computed=35, known=36 after first output | `Scheduler._update_after_schedule` | [scheduler.md](scheduler.md) |\n\n## Test coverage\n\n| Step | Test | Command | Status |\n|---|---|---|---|\n| sched.A1 | Extracted original arithmetic | `python tests/source_contracts.py REPO_ROOT` from this doc folder | pass |\n| kv.A1 | Original lookup methods, fake pool/spec | same standalone command | pass |\n| kv.A2 | Original capacity and allocate methods, fake coordinator | same standalone command | pass |\n| kv.A3 | Original allocate method's registration call order | same standalone command | pass |\n| sched.A2 | Full request/output lifecycle | `pytest tests/v1/core/test_scheduler.py::test_schedule_concurrent_partial_requests -q` from source root | not run (needs deps: tblib, vLLM runtime) |\n| kv.A1–kv.A3 | Repository prefix suite | `pytest tests/v1/core/test_prefix_caching.py::test_prefill -q` from source root | not run (needs deps: tblib, vLLM runtime) |\n\nSummary: eight grouped standalone CPU contracts passed. These execute original AST bodies and selected arithmetic statements, with explicitly fake dependencies. They do not execute a complete `Scheduler.schedule`, instantiate vLLM, or write KV tensors. Upstream collection failed at the repository conftest import of `tblib`; no upstream test executed. The exact extraction inventory and file hashes are in [contract results](explain.assets/source-contract-results-8f7c4c44120287e0.json).\n\n## Gaps\n\n| Step | Missing test or open question | Proposed test and assertion |\n|---|---|---|\n| sched.A1 / sched.A2 | Toy full scheduler lifecycle not executed | `test_single_request_35_tokens`: actual scheduler yields 16,16,3,1,1 with computed/known boundaries shown above |\n| kv.A3 | Real KV readiness not tested | `test_completed_prefix_replay`: finish warm producer, compare reused-prefix logits with uncached run on GPU |\n| kv.A2 | Real free queue and refcounts not executed by standalone tests | `test_idle_prefix_capacity`: two idle hits plus one new block reduce free count by three |\n\n## Glossary\n\n| Term | Meaning in this path | Code name |\n|---|---|---|\n| Known tokens | Prompt plus output IDs already stored | `Request.num_tokens` |\n| Computed boundary | Optimistic scheduled-token accounting; not proof of finished GPU work | `Request.num_computed_tokens` |\n| In-flight tokens | Scheduled positions not yet processed as outputs | `Request.num_in_flight_tokens` |\n| Prefix hit | Reused initial KV positions from matching hash metadata | `get_computed_blocks` |\n| Full block | 16 positions in this example | `block_size` |\n| Cached block | Hash-indexed metadata; readiness also depends on execution ordering | `cached_block_hash_to_block` |\n| Free block | Ref count zero, available for reuse or eviction | `free_block_queue` |\n\n## Shapes cheat sheet\n\nThe source boundary here contains CPU metadata, not model-forward tensors. A physical cache block denotes per-layer KV storage, but bytes and backend tensor layout depend on model dimensions, dtype and attention backend; those values are not inferred.\n\n| Object | Shape/type | Example | Location |\n|---|---|---|---|\n| Prompt IDs | `list[int]`, length P=35 | `[1,...,35]` | Request CPU memory |\n| Cache group IDs | `tuple[list[int], ...]`, G=1 | `([1,2,3],)` | Scheduler metadata |\n| Scheduled counts | `dict[str,int]`, one R | `{\"R\":3}` | SchedulerOutput CPU memory |\n| Logical KV slots | ceil((hit+new)/16) blocks | 3 blocks cover 48 slots for 35 inputs | Metadata maps to worker GPU KV |\n\n## Coverage of existing docs\n\n| Topic | Existing doc | Covered here | Note |\n|---|---|---|---|\n| `hash_block_tokens` | `docs/design/prefix_caching.md` | kv.A1 | Hashes include preceding prefix |\n| `get_computed_blocks` | same | kv.A1 | Current return has three values |\n| `ref_cnt`, `free_block_queue` | same | kv.A2 | Idle hits consume free capacity when touched |\n| `cache_full_blocks` | same | kv.A3 | Metadata registration precedes model execution |\n| Eviction | same | Out of scope | No eviction in the running trace; allocation evicts cached free blocks in `BlockPool.get_new_blocks` |\n\nThe pinned implementation is authoritative for behavior. The existing design document remains useful context but does not replace the current method signatures or branch order.\n\n## Out of scope\n\n| Branch | Why excluded | Source family |\n|---|---|---|\n| Priority preemption and pressure | One request, sufficient capacity | `Scheduler.schedule` |\n| Speculative/diffusion tokens | Dense autoregressive case without drafts | Same scheduler |\n| Fine-grained partial prefix reuse and CoW | Hash granularity equals physical block size | `FullAttentionManager.find_longest_cache_hit` |\n| Hybrid Mamba/sliding attention | One full-attention group | Hybrid coordinator and group managers |\n| Async and KV connectors | Producer completed before R arrives | Engine batch queue and connector paths |\n| HTTP/SSE, tokenizer and weights | Start at Request, stop at executor boundary | Entry points and worker modules |\n| Model architecture and kernels | Scheduling question does not require forward math | Model and attention implementations |\n\n## Refreshing this doc\n\nRun the skill scanner and checker against the pinned source. Re-run `python tests/source_contracts.py REPO_ROOT` from the document folder using an existing Python environment. Generated HTML needs CDN access for Mermaid and highlighting. Preserve [evidence.json](explain.assets/evidence-1bc9e3c44e9658ea.json) and the trace JSON when revising.\n"}, {"name": "scheduler.md", "title": "Scheduler: known tokens become scheduled positions", "md": "# Scheduler: known tokens become scheduled positions\n\nThis walkthrough covers token counts and the model-execution boundary. [kv-cache.md](kv-cache.md) explains physical block bookkeeping. Paths below are relative to the source repository root.\n\n## Contents\n\n- [Overview](#overview)\n- [sched.A Scheduling](#scheda-scheduling)\n\n## Overview\n\nThe scheduler chooses the next token positions to run and records the results.\n\n1. Find known tokens that still need computation, accounting for a reusable prefix.\n2. Limit that work to the token budgets and obtain the needed KV blocks.\n3. Hand the plan to the executor, then use its outputs to advance request state.\n\n**Example (illustrative).** For 35 prompt tokens and a budget of 16, the cold\nfirst plan contains 16 tokens. With 32 prefix tokens already cached, the first\nplan contains 3. Both plans include block metadata for the worker.\n\n\n```text\nEngineCore.step                         -> engine outputs in CPU memory # vllm/v1/engine/core.py\n  ├─ Scheduler.schedule                 -> SchedulerOutput             # vllm/v1/core/sched/scheduler.py sched.A1\n  │   ├─ KVCacheManager.allocate_slots   -> new block metadata          # vllm/v1/core/kv_cache_manager.py kv.A2\n  │   └─ Scheduler._update_after_schedule -> advanced boundary          # vllm/v1/core/sched/scheduler.py sched.A2\n  ├─ model_executor.execute_model       -> model output future         # vllm/v1/engine/core.py\n  └─ Scheduler.update_from_output       -> appended output IDs          # vllm/v1/core/sched/scheduler.py sched.A2\n```\n\n| Step | Artifact | Type | Location | Illustrative sample |\n|---|---|---|---|---|\n| sched.A1 | Scheduled counts | `dict[str,int]` | CPU SchedulerOutput | `{\"R\":16}` |\n| sched.A2 | Request boundaries | Integer counters and ID list | CPU Request | computed=35, known=36 |\n\n## sched.A Scheduling\n\nBring the request's completed work closer to its known token list.\n\n1. Count the still-uncomputed tokens and cap the work by available budgets.\n2. Obtain block metadata and send the plan to the executor.\n3. Apply the result to request state before the next iteration.\n\n**Input/output (illustrative).** With 35 known tokens and 32 already cached,\nthe plan schedules 3 token positions. Without a cache hit, its first chunk is 16.\n\n\n### sched.A1 Budget the uncomputed suffix (`vllm/v1/core/sched/scheduler.py`)\n\n**Idea.** The scheduler tries to make the computed boundary catch up with known tokens. It serves running requests before considering waiting requests. The 35-token request needs three cold prefill chunks with a 16-token compute budget.\n\n**Input.** One waiting request R with 35 constructed IDs; compute budget=16, input budget=16, draft slots=0. The prefix lookup returns either 0 or 32 already computed tokens.\n\n**Output.** CPU `SchedulerOutput.num_scheduled_tokens`, illustrated by `{\"R\":16}` for the cold first chunk and `{\"R\":3}` for the warm first chunk. The per-step budget is remaining compute capacity, not a maximum total prompt length.\n\n**Code.** Waiting requests use known token count rather than only prompt count, so resumed requests include their generated IDs:\n\n```python\n# vllm/v1/core/sched/scheduler.py  Scheduler.schedule\n                    request_token_budget = min(token_budget, input_budget - draft_slots)\n                    # Number of tokens to be scheduled.\n                    # We use `request.num_tokens` instead of\n                    # `request.num_prompt_tokens` to consider the resumed\n                    # requests, which have output tokens.\n                    num_new_tokens = request.num_tokens - num_computed_tokens\n```\n\nLater, the waiting branch applies the threshold, checks whether chunking is allowed, and caps by request budget. The running branch uses this arithmetic:\n\n```python\n# vllm/v1/core/sched/scheduler.py  Scheduler.schedule\n            num_new_tokens = (\n                request.num_tokens_with_spec\n                + request.num_output_placeholders\n                - request.num_computed_tokens\n            )\n            if 0 < self.scheduler_config.long_prefill_token_threshold < num_new_tokens:\n                num_new_tokens = self.scheduler_config.long_prefill_token_threshold\n            num_new_tokens = min(\n                num_new_tokens, token_budget, input_budget - draft_slots\n            )\n\n            # Make sure the input position does not exceed the max model len.\n            # This is necessary when using spec decoding.\n            num_new_tokens = min(\n                num_new_tokens,\n                self.max_model_len\n                - request.num_computed_tokens\n                - self.num_sampled_tokens_per_step,\n            )\n```\n\n`num_tokens_with_spec` equals known IDs plus draft IDs. In this example drafts and output placeholders are zero. The two budgets start at 16 each. After successful allocation, both lose the number scheduled; the input budget also loses per-request draft slots when drafting is active. A prefix hit of 32 spends neither budget on those 32 tokens.\n\n**Example.** Alternative executions:\n\n| Request state | Remaining known inputs | Scheduled | Budget left |\n|---|---:|---:|---:|\n| Cold waiting | 35−0=35 | 16 | 0 |\n| Cold running | 35−16=19 | 16 | 0 |\n| Cold running | 35−32=3 | 3 | 13 |\n| Warm waiting | 35−32=3 | 3 | 13 |\n| Decode after token 101 | 36−35=1 | 1 | 15 |\n| Decode after token 102 | 37−36=1 | 1 | 15 |\n\n**Math.** In the selected running branch, let K be known inputs, C the computed boundary, Q remaining compute budget, I remaining input budget, and L maximum model length. With no drafts/placeholders and the threshold disabled: scheduled=`min(K−C,Q,I,L−C−1)`. For the first decode, `min(36−35,16,16,128−35−1)=1`. The last limit reserves space for the sampled output position. The waiting branch has different code; do not apply this formula indiscriminately to all branches.\n\n**Tests.** Original running arithmetic AST statements pass on the cold sequence 16,16,3,1,1. This does not test the waiting queue or the complete scheduler. Repository `test_schedule_concurrent_partial_requests` in `tests/v1/core/test_scheduler.py` source-reviews budget caps and subsequent one-token decodes; not run because upstream collection needs `tblib` and the vLLM environment. Gap: execute the complete toy lifecycle with the real scheduler.\n\n### sched.A2 Advance counters before GPU completion (`vllm/v1/core/sched/scheduler.py`)\n\n**Idea.** The scheduler must send the old computed boundary to the worker so the worker selects the correct input positions. It then advances its own accounting before model execution completes.\n\n**Input.** R final prefill starts at computed=32 and schedules three positions. `SchedulerOutput` retains the starting boundary; the live Request is mutable CPU state.\n\n**Output.** After scheduling, computed=35 and in-flight grows by 3. After the synchronous worker completes and outputs token 101, known token count becomes 36. The sampled token itself has no computed KV yet. These are illustrative lifecycle values from source review, not a full runtime measurement.\n\n**Code.**\n\n```python\n# vllm/v1/core/sched/scheduler.py  Scheduler._update_after_schedule\n        #    computed tokens will be adjusted in update_from_output.\n        num_scheduled_tokens = scheduler_output.num_scheduled_tokens\n        for req_id, num_scheduled_token in num_scheduled_tokens.items():\n            request = self.requests[req_id]\n            request.num_computed_tokens += num_scheduled_token\n            request.num_in_flight_tokens += num_scheduled_token\n            if self.defer_block_free:\n                # Record the in-flight step, to fence deferred block freeing.\n                request.last_sched_seq = self.sched_step_seq\n            request.is_prefill_chunk = request.num_computed_tokens < (\n                request.num_tokens + request.num_output_placeholders\n            )\n```\n\nThe name `num_computed_tokens` therefore does not alone prove GPU readiness. `EngineCore.step` in `vllm/v1/engine/core.py` schedules, executes, waits for the future, optionally calls the separate sampler, and updates the scheduler from the output. `Request.append_output_token_ids` in `vllm/v1/request.py` extends both output IDs and all known IDs.\n\n**Example.**\n\n```text\nbefore final prefill:       known=35, computed=32\nschedule three positions:  known=35, computed=35, in_flight increases by 3\nworker completes:          KV positions 0..34 are ready (source-reviewed boundary)\nappend output ID 101:      known=36, computed=35\ndecode input ID 101:       schedule one; computed=36\nappend output ID 102:      known=37, computed=36\n```\n\nThis trace is sequential: the next schedule follows output processing. It does not prove readiness for overlapping async batches.\n\n**Tests.** The upstream concurrent-partial-request test explicitly supplies empty sampled lists for incomplete chunks and one sampled ID for finished prefills. Status: not run (needs deps: tblib, vLLM runtime). The standalone test checks count arithmetic only. Gap: actual Request and worker lifecycle for this exact example.\n\n## Other scheduler branches\n\n| Variant | Current switch | Effect outside the example |\n|---|---|---|\n| No chunking | `enable_chunked_prefill=false` | Waiting branch can stop when the suffix exceeds the budget |\n| Separate compute cap | `max_num_scheduled_tokens` | Can be below input budget; falls back to input cap when absent |\n| Long prefill cap | `long_prefill_token_threshold>0` | Reduces per-request work before the global cap |\n| Full input admission | `scheduler_reserve_full_isl` | Checks full sequence capacity before chunk admission |\n| Encoder/drafts/Mamba | Input/spec/model configuration | Additional caps, reservations and alignment |\n\nThese are source-reviewed alternatives. Their branch combinations were not executed in the standalone contracts.\n"}, {"name": "kv-cache.md", "title": "KV cache: a reused prefix still needs block ownership", "md": "# KV cache: a reused prefix still needs block ownership\n\nThis document covers full-attention block metadata for R. [scheduler.md](scheduler.md) covers the token budget. Paths below are relative to the source repository root.\n\n## Contents\n\n- [Overview](#overview)\n- [kv.A Prefix and capacity](#kva-prefix-and-capacity)\n- [Visual trace](#visual-trace)\n\n## Overview\n\nThe KV manager gives a request ownership of the memory blocks its next step needs.\n\n1. Find complete prefix blocks with matching context.\n2. Check capacity, attach reused blocks, and reserve blocks for the new suffix.\n3. Record cache metadata; the worker later writes new keys and values.\n\n**Example (illustrative).** A 35-token prompt with block size 16 can reuse\nblocks 1 and 2 for the first 32 tokens. It still needs block 3 for the tail.\nA block ID or a hash entry alone does not prove that new KV values are ready.\n\n\n```text\nKVCacheManager.get_computed_blocks       -> grouped hits, token count, boundary # vllm/v1/core/kv_cache_manager.py kv.A1\n  └─ UnitaryKVCacheCoordinator.find_longest_cache_hit -> one-group result        # vllm/v1/core/kv_cache_coordinator.py kv.A1\n      └─ FullAttentionManager.find_longest_cache_hit -> prefix block metadata    # vllm/v1/core/single_type_kv_cache_manager.py kv.A1\nKVCacheManager.allocate_slots            -> newly allocated blocks or None      # vllm/v1/core/kv_cache_manager.py kv.A2\n  ├─ coordinator.get_num_blocks_to_allocate -> capacity demand                  # vllm/v1/core/kv_cache_manager.py kv.A2\n  ├─ coordinator.allocate_new_computed_blocks -> prefix ownership               # vllm/v1/core/kv_cache_manager.py kv.A2\n  ├─ coordinator.allocate_new_blocks     -> new suffix capacity                 # vllm/v1/core/kv_cache_manager.py kv.A2\n  └─ coordinator.cache_blocks            -> full-block hash index metadata      # vllm/v1/core/kv_cache_manager.py kv.A3\n```\n\n| Step | Artifact | Type | Location | Illustrative sample |\n|---|---|---|---|---|\n| kv.A1 | Computed blocks | `KVCacheBlocks` and two integers | CPU metadata | `([1,2],),32,0` |\n| kv.A2 | New suffix blocks | `KVCacheBlocks` or `None` | CPU metadata referring to GPU cache | `([3],)` |\n| kv.A3 | Cache index | Hash-to-block metadata map | CPU BlockPool | h1 maps to block 1 |\n\n## kv.A Prefix and capacity\n\nA cache hit can save computation only when the request can own the required pages.\n\n1. Look up matching complete prefix blocks.\n2. Check capacity, attach the hits, and allocate the missing suffix blocks.\n3. Register eligible hash metadata, keeping it distinct from completed KV.\n\n**Input/output (illustrative).** A 35-token request reuses blocks 1 and 2 for\n32 prefix tokens and reserves block 3 for the final three input tokens.\n\n\n### kv.A1 Look up the prefix, with a last-token limit (`vllm/v1/core/kv_cache_manager.py`)\n\n**Idea.** Cache hits skip initial model work. They require matching preceding context, not merely identical tokens in one block.\n\n**Input.** R IDs `[1,...,35]`; two full 16-token blocks and three tail tokens. A completed prior request left block 1 for IDs 1–16 and block 2 for IDs 17–32.\n\n**Output.** The current `get_computed_blocks` returns three values: grouped block metadata, hit-token count, and shared-prefix boundary. Warm output is `([1,2],),32,0`; cold output is `([],),0,0`. The scheduler's `_get_local_prefix_cache_hit` wrapper adds a fourth boolean for hybrid/connector logic. That boolean is false on this path.\n\n**Code.**\n\n```python\n# vllm/v1/core/kv_cache_manager.py  KVCacheManager.get_computed_blocks\n        # (which happens when the request requires prompt logprobs\n        # or calls a pooling model with all pooling).\n        if not self.prefix_cache_lookup_enabled(request):\n            return self.empty_kv_cache_blocks, 0, 0\n\n        # NOTE: When all tokens hit the cache, we must recompute the last token\n        # to obtain logits. Thus, set max_cache_hit_length to prompt_length - 1.\n        # This can trigger recomputation of an entire block, rather than just\n        # the single last token, because allocate_slots() requires\n        # num_computed_tokens to be block-size aligned. Removing this limitation\n        # could slightly improve performance in the future.\n        max_cache_hit_length = request.num_tokens - 1\n        computed_blocks, num_new_computed_tokens, num_uncached = (\n            self.coordinator.find_longest_cache_hit(\n                request.block_hashes, max_cache_hit_length\n            )\n        )\n\n        # When kv_cache_report_mode is \"full\", emit BlockStored events\n        # for the reused prefix cache blocks so that external consumers\n```\n\nThe single-group coordinator passes physical block size 16 as the alignment. The full-attention lookup searches matching blocks from the start and stops on its first miss. Equal hash and physical granularity means no fine-grained partial hit in this example.\n\n`hash_block_tokens` in `vllm/v1/core/kv_cache_utils.py` chains the parent hash, current IDs and extra keys:\n\n```python\n# vllm/v1/core/kv_cache_utils.py  hash_block_tokens\n    if not parent_block_hash:\n        parent_block_hash = NONE_HASH\n\n    curr_block_token_ids_tuple = tuple(curr_block_token_ids)\n    return BlockHash(\n        hash_function((parent_block_hash, curr_block_token_ids_tuple, extra_keys))\n    )\n\n\n```\n\n**Example.** Hash labels h1 and h2 are schematic, not measured digest bytes. h2 represents the prefix ending at position 32. Changing the first block invalidates that initial prefix. R's tail has only three IDs, so it contributes no full-block hash at granularity 16.\n\n| Input length | Lookup limit | Maximum whole blocks | Warm hit |\n|---|---:|---:|---:|\n| 35 | 34 | floor(34/16)=2 | 32 tokens |\n| 32 | 31 | floor(31/16)=1 | 16 tokens |\n\nFor an exactly 32-token prompt, both physical blocks might be cached, but this selected alignment replays the entire second block to obtain last-position logits. Do not generalize that whole-block result to the newer fine-grained hit branch.\n\n**Tests.** Original full-attention lookup passes warm hit=32, changed-first-block miss=0, and exact-32 cap=16 with a fake cache map. Original manager method also passes normal and skipped-lookup branches. Fake hash resolution is identity because granularity is equal. `test_prefill` in `tests/v1/core/test_prefix_caching.py` checks miss/hit blocks and references with real managers, but was not run (needs deps: tblib, vLLM runtime). Hash construction here is source-reviewed, not executed by the standalone contracts.\n\n### kv.A2 Attach cached blocks, allocate the suffix (`vllm/v1/core/kv_cache_manager.py`)\n\n**Idea.** Saved compute does not remove the need to hold the prefix's KV. Attaching idle cached blocks removes them from free capacity.\n\n**Input.** Warm hit=32, new computation=3, no lookahead or external tokens. R has no blocks attached yet. Pool has 11 total blocks; block 0 is null and 10 are usable. Two idle cached hits are in the free queue.\n\n**Output.** Logical block table `([1,2,3],)` covers 48 slots. The allocation return contains only newly allocated block 3, `([3],)`. Full table lookup is separate. Idle blocks 1 and 2 become owned by R; each ref count moves from 0 to 1. Free capacity falls from 10 to 7. These physical IDs and ownership counts are illustrative; the standalone test validates the required count with stand-ins, not the real queue.\n\n**Code.** The normal admission check runs before attachment and new allocation:\n\n```python\n# vllm/v1/core/kv_cache_manager.py  KVCacheManager.allocate_slots\n        available_blocks = self.block_pool.get_num_free_blocks() - reserved_blocks\n        required_blocks = num_blocks_to_allocate + watermark_blocks\n        if required_blocks > available_blocks:\n            # Cannot allocate new blocks\n            return None\n\n        if (\n            new_computed_block_list is not self.empty_kv_cache_blocks.blocks\n            or num_external_computed_tokens > 0\n        ):\n            # Append the new computed blocks to the request blocks until now to\n            # avoid the case where the new blocks cannot be allocated.\n            self.coordinator.allocate_new_computed_blocks(\n                request_id=request.request_id,\n                new_computed_blocks=new_computed_block_list,\n                num_local_computed_tokens=num_local_computed_tokens,\n                num_external_computed_tokens=num_external_computed_tokens,\n            )\n```\n\nThe source has extra gates for full-sequence admission, watermarks and in-flight reservations. The example disables full-sequence reservation, has no connector reservation, and admits no waiting request alongside running work, so no watermark applies. `SingleTypeKVCacheManager.get_num_blocks_to_allocate` counts both newly needed blocks and cached hits whose ref count is zero. `BlockPool.touch` in `vllm/v1/core/block_pool.py` removes idle hit blocks from the free queue and increments refs.\n\n**Example.**\n\n```text\nlogical positions    physical block    R owns after allocation    scheduled new work\n0..15                1 (prefix hit)    yes                       none\n16..31               2 (prefix hit)    yes                       none\n32..34               3 (new suffix)    yes                       three tokens\n35..47               3 (unused slots)  yes                       none\n```\n\n**Math.** Required logical blocks=`ceil((32+3)/16)=3`. New blocks=`3−2=1`. Free-capacity demand=`1 new + 2 idle hits=3`. With only two free blocks, allocation returns `None` before prefix attachment or new-block allocation. If the two hits were actively referenced by another request, touching would increase refs without removing them from the free queue; the required free count would differ.\n\nFor the cold path, three prefill chunks allocate one block each: after 16 inputs, `[1]`; after 32, `[1,2]`; after 35, `[1,2,3]`. Both decode inputs still fit block 3, so no fourth block is needed. Position 48 would require one.\n\n**Tests.** Original count method returns demand=3 for two idle prefix hits plus one new block, zero for a running request extending within block 3, and one at 49 required positions. Original `allocate_slots` passes success and failure call-order contracts with a fake coordinator. The repository `test_prefill` covers actual `ref_cnt` and free-queue behavior; not run (needs deps: tblib, vLLM runtime).\n\n### kv.A3 Separate hash registration from ready KV (`vllm/v1/core/single_type_kv_cache_manager.py`)\n\n**Idea.** Hash computation, capacity allocation, index registration and completed KV computation are different events. The source registers full finalized blocks during allocation, before the executor runs.\n\n**Input.** R has attached prefix blocks and capacity for 35 positions. Known token IDs are finalized; there are no rejected draft tokens. Two full blocks exist, with a three-token partial tail.\n\n**Output.** The CPU hash index covers full blocks only. After scheduling a cold 16-token chunk, block 1 can already have hash metadata while its GPU KV is pending. After execution completes, those 16 positions become ready. This example's warm cache explicitly comes from completed work, avoiding an untested async readiness assumption.\n\n**Code.**\n\n```python\n# vllm/v1/core/kv_cache_manager.py  KVCacheManager.allocate_slots\n        # \"non-committable\" tokens (e.g., draft tokens that could be rejected).\n        # Therefore, we cap the number at `request.num_tokens`, ensuring only\n        # \"finalized\" tokens are cached.\n        num_tokens_to_cache = min(\n            total_computed_tokens + num_new_tokens,\n            request.num_tokens,\n        )\n        self.coordinator.cache_blocks(request, num_tokens_to_cache)\n\n        return self.create_kv_cache_blocks(new_blocks)\n\n    def free(self, request: Request) -> None:\n        \"\"\"Free the blocks allocated for the request.\n        We free the blocks in reverse order so that the tail blocks are evicted\n        first when caching is enabled.\n\n```\n\n`SingleTypeKVCacheManager.cache_blocks` uses `num_full_blocks = num_tokens // self.block_size`, then delegates to `BlockPool.cache_full_blocks` in `vllm/v1/core/block_pool.py`. That method updates block hashes and the lookup index. Neither method performs model attention. On the selected engine path, GPU execution happens later in `EngineCore.step`.\n\n**Example.**\n\n| Event | Index metadata | Ready KV from this request |\n|---|---|---|\n| Cold chunk 1 allocated/scheduled | h1 can map to block 1 | none yet for this chunk |\n| Cold chunk 1 execution completes | h1 remains registered | positions 0–15 |\n| Cold chunk 2 allocated/scheduled | h2 can map to block 2 | only previous positions 0–15 before execution |\n| Final prefill execution completes | h1 and h2 indexed; block 3 partial | positions 0–34 |\n| Warm R admitted after prior producer completed | existing h1/h2, ref counts increase | prefix 0–31 already ready |\n\nA freed hashed block can remain cached with ref count zero. Allocation may later evict it. `BlockPool.free_blocks` currently prepends unhashed blocks and appends hashed blocks, so its queue order is more specific than a blanket “append all freed blocks” description. That order is source-reviewed; this trace has no eviction or finishing R.\n\n**Tests.** The original allocation contract proves the coordinator's cache registration is called after new allocation, within `allocate_slots`. It does not prove GPU readiness. Repository `test_cache_blocks` and `test_prefill` in `tests/v1/core/test_prefix_caching.py` inspect block metadata, not a full model run; not run (needs deps: tblib, vLLM runtime). Gap: completed-prefix replay compared with uncached logits on a real supported model.\n\n## Visual trace\n\nThe states use the exact values above. Display durations are illustrative, not latency measurements. Green means ready reused KV; amber means newly scheduled pending work. The index label states registration separately from KV readiness.\n\n![Warm allocation: two idle prefix hits plus one suffix block](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA5NjAgNDg1IiByb2xlPSJpbWciIGFyaWEtbGFiZWw9Ildhcm0gYWxsb2NhdGlvbjogb3duIHByZWZpeCBhbmQgcmVzZXJ2ZSBzdWZmaXgiPgo8dGl0bGU+V2FybSBhbGxvY2F0aW9uOiBvd24gcHJlZml4IGFuZCByZXNlcnZlIHN1ZmZpeDwvdGl0bGU+CjxkZXNjPk9uZSBuZXdseSBhbGxvY2F0ZWQgYmxvY2s7IHR3byBpZGxlIGhpdHMgYWxzbyBjb25zdW1lIGZyZWUgY2FwYWNpdHkuPC9kZXNjPgo8c3R5bGU+dGV4dHtmb250LWZhbWlseTpBcmlhbCxIZWx2ZXRpY2Esc2Fucy1zZXJpZjtmaWxsOiMxNzJiNDV9LmJvZHl7Zm9udC1zaXplOjIycHh9LmxhYmVse2ZvbnQtc2l6ZToyMnB4O2ZvbnQtd2VpZ2h0OjcwMH0udG9rZW57Zm9udDoyMHB4IG1vbm9zcGFjZTt0ZXh0LWFuY2hvcjptaWRkbGV9PC9zdHlsZT4KPHJlY3Qgd2lkdGg9Ijk2MCIgaGVpZ2h0PSI0ODUiIGZpbGw9IiNmZmYiLz4KPHRleHQgeD0iMzIiIHk9IjM1IiBmb250LXNpemU9IjE1IiBmaWxsPSIjNTI2MTc0Ij5TVEVQIDYgLyA5IMK3IGlsbHVzdHJhdGl2ZSBzdGF0ZSDCtyBpbGx1c3RyYXRpdmUgdGltaW5nPC90ZXh0Pgo8dGV4dCB4PSIzMiIgeT0iNzgiIGZvbnQtc2l6ZT0iMjgiIGZvbnQtd2VpZ2h0PSI3MDAiPldhcm0gYWxsb2NhdGlvbjogb3duIHByZWZpeCBhbmQgcmVzZXJ2ZSBzdWZmaXg8L3RleHQ+CjxyZWN0IHg9IjMyLjAiIHk9IjEzNCIgd2lkdGg9IjI4NS4zMzMzMzMzMzMzMzMzIiBoZWlnaHQ9IjI0NiIgcng9IjE0IiBmaWxsPSIjZThmNmVmIiBzdHJva2U9IiMxNjgwNTIiIHN0cm9rZS13aWR0aD0iMS41Ii8+Cjx0ZXh0IHg9IjUyLjAiIHk9IjE2OCIgY2xhc3M9ImxhYmVsIj5SZWFkeSByZXVzZWQg <script>
(function () {
  const DOCS = JSON.parse(document.getElementById("docs-data").textContent);
  const NAMES = DOCS.map(d => d.name);
  const esc = s => s.replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
  const plain = s => s.replace(/`/g, "").replace(/\*\*|__/g, "").replace(/\[([^\]]*)\]\([^)]*\)/g, "$1");

  // GitHub-style slugs, so links written for GitHub/Cursor preview resolve here.
  function makeSlugger() {
    const seen = new Set();
    return function (text) {
      const base = plain(text).trim().toLowerCase().replace(/[^\p{L}\p{N}_\- ]/gu, "").replace(/ /g, "-");
      let s = base, suffix = 0;
      while (seen.has(s)) s = base + "-" + (++suffix);
      seen.add(s);
      return s;
    };
  }

  function headingsOf(md) {
    const slug = makeSlugger(), out = [];
    marked.walkTokens(marked.lexer(md), t => {
      if (t.type !== "heading") return;
      const id = slug(t.text); // Consume deeper headings too, matching the renderer.
      if (t.depth <= 3) out.push({depth: t.depth, text: plain(t.text), id});
    });
    return out;
  }
  DOCS.forEach(d => { d.headings = headingsOf(d.md); });

  function katexRender(tex, display) {
    try { return katex.renderToString(tex, {displayMode: display, throwOnError: false}); }
    catch (e) { return "<code>" + esc(tex) + "</code>"; }
  }
  const mathBlock = {
    name: "mathBlock", level: "block",
    start(src) { const m = src.match(/(^|\n)[ \t]*(\\\[|\$\$)/); return m ? m.index + m[1].length : undefined; },
    tokenizer(src) {
      const m = /^[ \t]*(?:\\\[([\s\S]+?)\\\]|\$\$([\s\S]+?)\$\$)[ \t]*(?:\n|$)/.exec(src);
      if (m) return {type: "mathBlock", raw: m[0], text: (m[1] || m[2]).trim()};
    },
    renderer(t) { return '<div class="math-block">' + katexRender(t.text, true) + "</div>"; }
  };
  const mathInline = {
    name: "mathInline", level: "inline",
    start(src) { const m = src.match(/\\\(|\\\[/); return m ? m.index : undefined; },
    tokenizer(src) {
      let m = /^\\\(([\s\S]+?)\\\)/.exec(src);
      if (m) return {type: "mathInline", raw: m[0], text: m[1], display: false};
      m = /^\\\[([\s\S]+?)\\\]/.exec(src);
      if (m) return {type: "mathInline", raw: m[0], text: m[1], display: true};
    },
    renderer(t) { return katexRender(t.text, t.display); }
  };

  let slug = makeSlugger(), activeDoc = DOCS[0].name, renderGeneration = 0;
  const docHref = (name, anchor = "") => "#/" + encodeURIComponent(name) +
    (anchor ? "#" + encodeURIComponent(anchor) : "");
  const fragment = value => { try { return decodeURIComponent(value); } catch (_) { return value; } };
  const renderer = {
    heading(text, level, raw) {
      const id = slug(raw);
      return "<h" + level + ' id="' + id + '">' + text + "</h" + level + ">\n";
    },
    code(code, info) {
      const lang = (info || "").trim().split(/\s+/)[0];
      if (lang === "mermaid") return '<div class="mermaid">' + esc(code) + "</div>";
      let html;
      if (lang && hljs.getLanguage(lang)) html = hljs.highlight(code, {language: lang}).value;
      else html = esc(code);
      return '<pre><button class="copy">copy</button><code class="hljs">' + html + "</code></pre>";
    },
    table(header, body) {
      return '<div class="table-wrap"><table><thead>' + header + "</thead><tbody>" + body + "</tbody></table></div>";
    },
    link(href, title, text) {
      if (/^#(?!\/)/.test(href || "")) href = docHref(activeDoc, fragment(href.slice(1)));
      const m = /^(?:\.\/)?([\w.\-\/]+\.md)(#.*)?$/.exec(href || "");
      if (m) {
        const name = m[1].split("/").pop();
        if (NAMES.includes(name)) href = docHref(name, fragment((m[2] || "").slice(1)));
      }
      const ext = /^https?:/.test(href || "") ? ' target="_blank" rel="noopener"' : "";
      return '<a href="' + esc(href || "") + '"' + (title ? ' title="' + esc(title) + '"' : "") + ext + ">" + text + "</a>";
    }
  };
  marked.use({gfm: true, extensions: [mathBlock, mathInline], renderer});
  mermaid.initialize({startOnLoad: false, securityLevel: "strict", theme: "base",
    themeVariables: {fontFamily: "system-ui, sans-serif", fontSize: "16px",
      primaryColor: "#f1f6ff", primaryTextColor: "#172536", primaryBorderColor: "#6b85a6",
      lineColor: "#51627a", clusterBkg: "#f8fafc", clusterBorder: "#cbd5e1"},
    flowchart: {htmlLabels: false, nodeSpacing: 28, rankSpacing: 40, curve: "linear"}});

  function diagramControls(n, source) {
    const svg = n.querySelector("svg"), box = svg && svg.viewBox.baseVal;
    if (!box || !box.width || !box.height) return;
    const tools = document.createElement("div");
    tools.className = "diagram-tools";
    tools.setAttribute("role", "group"); tools.setAttribute("aria-label", "Diagram controls");
    tools.innerHTML = '<button type="button">Fit</button><button type="button" aria-label="Zoom in">+</button>' +
      '<button type="button" aria-label="Zoom out">−</button><button type="button">Save SVG</button>' +
      '<small>Zoom to read labels; scroll to pan.</small>';
    n.before(tools);
    let scale;
    function setScale(value) {
      scale = value;
      svg.style.maxWidth = "none"; svg.style.width = (box.width * scale) + "px";
      svg.style.height = "auto";
    }
    function fit() { setScale(Math.min(1, Math.max(100, n.clientWidth - 26) / box.width, 500 / box.height)); }
    const buttons = tools.querySelectorAll("button");
    buttons[0].onclick = fit;
    buttons[1].onclick = () => setScale(Math.min(4, scale * 1.4));
    buttons[2].onclick = () => setScale(Math.max(0.02, scale / 1.4));
    buttons[3].onclick = () => {
      const url = URL.createObjectURL(new Blob([source], {type: "image/svg+xml"}));
      const a = document.createElement("a"); a.href = url; a.download = "diagram.svg"; a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    };
    fit();
    // Start with readable labels; Fit remains available as a whole-map overview.
    if (scale < 0.8) setScale(0.8);
  }

  // One diagram at a time, so a broken diagram shows its own error and source
  // in place and the others still render. window.explainDiagramErrors and the
  // page title report the count, for a quick check after rendering.
  let renderSeq = 0;
  async function renderDiagrams(el, doc, generation) {
    const nodes = [...el.querySelectorAll(".mermaid")];
    let errors = 0;
    for (const n of nodes) {
      const src = n.textContent, id = "mmd-" + (++renderSeq);
      try {
        const out = await mermaid.render(id, src);
        if (generation !== renderGeneration) return;
        n.innerHTML = out.svg;
        diagramControls(n, out.svg);
      } catch (err) {
        if (generation !== renderGeneration) return;
        errors += 1;
        const stray = document.getElementById("d" + id) || document.getElementById(id);
        if (stray && !el.contains(stray)) stray.remove();
        n.classList.add("mermaid-failed");
        n.innerHTML = '<div class="mermaid-error">Diagram error: ' +
          esc(String(err && err.message ? err.message : err)) + "</div><pre>" + esc(src) + "</pre>";
      }
    }
    if (generation !== renderGeneration) return;
    window.explainDiagramErrors = errors;
    document.title = (errors ? "[" + errors + " diagram error" + (errors > 1 ? "s" : "") + "] " : "") + doc.title;
  }

  function tocMarkdown(doc) {
    return doc.headings.filter(h => h.depth >= 2).map(h =>
      "  ".repeat(h.depth - 2) + "- [" + h.text.replace(/[\[\]]/g, "") + "](" + docHref(doc.name, h.id) + ")").join("\n");
  }

  function render(name, anchor) {
    const doc = DOCS.find(d => d.name === name) || DOCS[0];
    activeDoc = doc.name;
    const generation = ++renderGeneration;
    let md = doc.md.replace(/^\s*(\[TOC\]|\[\[_TOC_\]\])\s*$/gm, () => tocMarkdown(doc));
    slug = makeSlugger();
    const el = document.getElementById("content");
    el.innerHTML = marked.parse(md);
    el.querySelectorAll("img").forEach(img => {
      if (!/^data:image\/svg\+xml|\.svg(?:[?#]|$)/i.test(img.src)) return;
      const frame = document.createElement("div"); frame.className = "svg-frame";
      img.before(frame); frame.append(img);
      const size = () => { if (img.naturalWidth) img.style.setProperty("--figure-width", img.naturalWidth + "px"); };
      img.addEventListener("load", size); size();
    });
    el.querySelectorAll("pre .copy").forEach(b => b.addEventListener("click", () => {
      navigator.clipboard.writeText(b.nextElementSibling.innerText);
      b.textContent = "copied"; setTimeout(() => { b.textContent = "copy"; }, 1200);
    }));
    renderDiagrams(el, doc, generation).then(() => {
      if (generation === renderGeneration && anchor) {
        const target = document.getElementById(anchor); if (target) target.scrollIntoView();
      }
    });
    const i = DOCS.indexOf(doc), prev = DOCS[i - 1], next = DOCS[i + 1];
    document.getElementById("pager").innerHTML =
      (prev ? '<a href="#/' + prev.name + '">&larr; ' + esc(prev.title) + "</a>" : "<span></span>") +
      (next ? '<a href="#/' + next.name + '">' + esc(next.title) + " &rarr;</a>" : "<span></span>");
    if (!el.querySelector(".mermaid")) document.title = doc.title;
    buildNav(doc.name, "");
    if (anchor) { const t = document.getElementById(anchor); if (t) { t.scrollIntoView(); return; } }
    window.scrollTo(0, 0);
  }

  function buildNav(active, query) {
    const nav = document.getElementById("nav");
    const q = query.trim().toLowerCase();
    let html = "";
    if (q) {
      for (const d of DOCS) {
        for (const h of d.headings) if (h.text.toLowerCase().includes(q))
          html += '<a class="h2 hit" href="#/' + d.name + "#" + h.id + '">' + esc(h.text) + " <small>" + esc(d.name) + "</small></a>";
        const n = d.md.toLowerCase().split(q).length - 1;
        if (n) html += '<a class="doc" href="#/' + d.name + '">' + esc(d.title) + " <small>(" + n + " text matches)</small></a>";
      }
      nav.innerHTML = html || "<small>No matches</small>";
      return;
    }
    for (const d of DOCS) {
      html += '<a class="doc' + (d.name === active ? " active" : "") + '" href="#/' + d.name + '">' + esc(d.title) + "</a>";
      if (d.name === active)
        for (const h of d.headings) if (h.depth >= 2)
          html += '<a class="h' + h.depth + '" href="#/' + d.name + "#" + h.id + '" title="' + esc(h.text) + '">' + esc(h.text) + "</a>";
    }
    nav.innerHTML = html;
  }

  function route() {
    const raw = location.hash.slice(1);
    const h = fragment(raw.replace(/^\//, ""));
    const cut = h.indexOf("#");
    const name = cut < 0 ? h : h.slice(0, cut), anchor = cut < 0 ? "" : h.slice(cut + 1);
    // A plain Markdown fragment belongs to the current doc, not the first doc.
    if (raw && !raw.startsWith("/") && !NAMES.includes(name)) {
      history.replaceState(null, "", docHref(activeDoc, h));
      render(activeDoc, h);
    } else render(name || DOCS[0].name, anchor);
  }
  document.getElementById("search").addEventListener("input", e => {
    buildNav(activeDoc, e.target.value);
  });
  document.addEventListener("click", e => {
    const link = e.target.closest("a[href]");
    if (!link || e.button !== 0 || e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) return;
    const href = link.getAttribute("href");
    if (href.startsWith("#/") && href === location.hash) {
      e.preventDefault(); route(); // Clicking the current TOC target still scrolls there.
    }
  });
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
