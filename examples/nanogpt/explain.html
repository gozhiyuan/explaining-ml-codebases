<script id="docs-data" type="application/json">[{"name": "index.md", "title": "nanoGPT: one small CPU training step", "md": "# nanoGPT: one small CPU training step\n\nThis source walkthrough follows a batch of token windows through a decoder, loss, gradients, and one AdamW update. It targets engineers who know tensors and want to verify nanoGPT's training path.\n\nCommit: `3adf61e154c3fe3fca428ad6bc3818b27a3b8291`. Mode: `deep`. Audience: ML engineers new to this repository.\nScope: one CPU update, float32, one block, no compilation or distributed processes.\nSource: [karpathy/nanoGPT at the explained commit](https://github.com/karpathy/nanoGPT/tree/3adf61e154c3fe3fca428ad6bc3818b27a3b8291).\n\n## Contents\n\n- [Mental model](#mental-model)\n- [Big picture](#big-picture)\n- [Running example](#running-example)\n- [Doc map](#doc-map)\n- [Key sequences](#key-sequences)\n- [Test coverage](#test-coverage)\n- [Gaps](#gaps)\n- [Shapes cheat sheet](#shapes-cheat-sheet)\n- [Out of scope](#out-of-scope)\n\n## Mental model\n\n1. The loader reads a flat stream of token IDs and selects random starting offsets.\n2. Each input window has a target window shifted one token to the right.\n3. The decoder adds token and position embeddings, then applies causal attention and an MLP.\n4. Training predicts a vocabulary distribution at every position, including the final position.\n5. Cross entropy averages eight next-token errors into one scalar for this batch.\n6. Backward fills parameter gradients. Clipping limits their total norm before AdamW changes the weights.\n7. Clearing gradients ends the update. The batch fetched before backward belongs to the next micro-step.\n\n## At a glance\n\n| Knob | Tiny validation | Repository source | Meaning |\n|---|---|---|---|\n| Batch and context | B=2, T=4 | `batch_size`, `block_size` in `train.py` | Eight target predictions |\n| Model | L=1, D=8, H=2, V=8 | `GPTConfig` in `model.py` | Small fixture model |\n| Random seed | 1337 | `torch.manual_seed` in `train.py` | Same seed, reset separately for batch and initialization |\n| Precision | float32 on CPU | `ctx` in `train.py` | CPU uses `nullcontext`, not autocast |\n| Dropout and bias | 0.0, False | Fixture overrides | Deterministic validation, no linear or norm biases |\n| Accumulation | A=1 | Fixture override | One batch per update |\n| Optimizer | AdamW, LR=0.001, decay=0.1 | `GPT.configure_optimizers` | Betas=(0.9,0.95) |\n| PyTorch | 2.14.1 | Installed validation runtime | SDPA API path, CPU kernels |\n\nThese values deliberately shrink the README's CPU example. They are not nanoGPT defaults. The character config uses B=64, T=256, L=6, H=6, D=384. Its preparation script reports V=65 for the original text.\n\n## Big picture\n\n```mermaid\nflowchart LR\n    stream[\"uint16 token stream\"] -->|\"two windows\"| batch[\"X and Y int64 [2,4]\"]\n    batch -->|\"X\"| gpt[\"GPT forward\"]\n    gpt -->|\"logits [2,4,8]\"| ce[\"Cross entropy with Y\"]\n    ce -->|\"scalar loss\"| backward[\"Backward\"]\n    backward -->|\"parameter gradients\"| clip[\"Clip total norm to 1\"]\n    clip -->|\"clipped gradients\"| adam[\"AdamW step\"]\n    adam -->|\"updated parameters\"| clear[\"Clear gradients\"]\n```\n\nArrows mean data dependency. They do not represent CPU/GPU overlap. The original loop fetches its next batch between forward and backward. On this CPU path, those calls execute sequentially.\n\n## Running example\n\nThe fixture stream is `[0,1,2,3,4,5,6,7,0,1,2,3]`, stored as uint16. IDs denote eight invented token classes. They are not Shakespeare characters or GPT-2 BPE IDs.\n\n| State | Actual object |\n|---|---|\n| Measured batch from original loader | X=`[[7, 0, 1, 2], [5, 6, 7, 0]]`, Y=`[[0, 1, 2, 3], [6, 7, 0, 1]]` |\n| Measured logits | float32 CPU `[2,4,8]`, first vector `[0.15, 0.0385, -0.0347, 0.111, 0.0633, -0.045, -0.0148, 0.0732]` |\n| Measured loss before update | 2.056858 nats per target |\n| Measured gradient norm | 1.218671 before clipping, 0.999999 after |\n| Measured same-batch loss after update | 2.044125 nats per target |\n\nInitialization and batch sampling each reset seed 1337. This isolates the example from setup-time random draws. The full training process does not perform those two separate resets. Rounded display values come from [measurement.json](explain.assets/measurement-42f16877471dcec5.json).\n\n![Two shifted token windows](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA5MDAgNjMwIiByb2xlPSJpbWciIGFyaWEtbGFiZWw9IlR3byB3aW5kb3dzIHByb2R1Y2UgZWlnaHQgdGFyZ2V0cyI+PHN0eWxlPnRleHR7Zm9udC1mYW1pbHk6c3lzdGVtLXVpLHNhbnMtc2VyaWY7ZmlsbDojMTgyNDNjO2ZvbnQtc2l6ZToxOXB4fSAuc21hbGx7Zm9udC1zaXplOjE3cHh9IC5tb25ve2ZvbnQtZmFtaWx5Om1vbm9zcGFjZX08L3N0eWxlPjxyZWN0IHdpZHRoPSI5MDAiIGhlaWdodD0iNjMwIiBmaWxsPSJ3aGl0ZSIvPjx0ZXh0IHg9IjMwIiB5PSIzNSIgZm9udC13ZWlnaHQ9IjcwMCI+VHdvIHdpbmRvd3MgcHJvZHVjZSBlaWdodCB0YXJnZXRzPC90ZXh0Pjx0ZXh0IHg9IjMwIiB5PSI3MCIgY2xhc3M9InNtYWxsIj5JbnB1dCBhbmQgdGFyZ2V0IHNoYXJlIGEgc3RyZWFtLiBBcnJvd3MgYmVsb3cgbWVhbiBuZXh0LXRva2VuIHByZWRpY3Rpb24uPC90ZXh0Pjx0ZXh0IHg9IjMwIiB5PSIxNDMiPlN0cmVhbTwvdGV4dD48cmVjdCB4PSIxODAiIHk9IjExMCIgd2lkdGg9IjQ5IiBoZWlnaHQ9IjUyIiByeD0iNyIgZmlsbD0iI2VlZjFmNiIvPjx0ZXh0IHg9IjE5OCIgeT0iMTQzIiBjbGFzcz0ibW9ubyI+MDwvdGV4dD48cmVjdCB4PSIyMzciIHk9IjExMCIgd2lkdGg9IjQ5IiBoZWlnaHQ9IjUyIiByeD0iNyIgZmlsbD0iI2VlZjFmNiIvPjx0ZXh0IHg9IjI1NSIgeT0iMTQzIiBjbGFzcz0ibW9ubyI+MTwvdGV4dD48cmVjdCB4PSIyOTQiIHk9IjExMCIgd2lkdGg9IjQ5IiBoZWlnaHQ9IjUyIiByeD0iNyIgZmlsbD0iI2VlZjFmNiIvPjx0ZXh0IHg9IjMxMiIgeT0iMTQzIiBjbGFzcz0ibW9ubyI+MjwvdGV4dD48cmVjdCB4PSIzNTEiIHk9IjExMCIgd2lkdGg9IjQ5IiBoZWlnaHQ9IjUyIiByeD0iNyIgZmlsbD0iI2VlZjFmNiIvPjx0ZXh0IHg9IjM2OSIgeT0iMTQzIiBjbGFzcz0ibW9ubyI+MzwvdGV4dD48cmVjdCB4PSI0MDgiIHk9IjExMCIgd2lkdGg9IjQ5IiBoZWlnaHQ9IjUyIiByeD0iNyIgZmlsbD0iI2VlZjFmNiIvPjx0ZXh0IHg9IjQyNiIgeT0iMTQzIiBjbGFzcz0ibW9ubyI+NDwvdGV4dD48cmVjdCB4PSI0NjUiIHk9IjExMCIgd2lkdGg9IjQ5IiBoZWlnaHQ9IjUyIiByeD0iNyIgZmlsbD0iI2VlZjFmNiIvPjx0ZXh0IHg9IjQ4MyIgeT0iMTQzIiBjbGFzcz0ibW9uby cadence with correct averaged gradients |\n| train.B2 | Checkpoint and resume | `test_resume_roundtrip`: reload model and optimizer and reproduce next update |\n\n## Glossary\n\n| Term | Meaning | Code name |\n|---|---|---|\n| Context window | Consecutive input positions | `block_size` |\n| Micro-batch | One model call before accumulated update | `batch_size` |\n| Vocabulary | Number of output token classes | `vocab_size` |\n| Causal | Position cannot use later input tokens | `is_causal=True` |\n| Weight tying | Token embedding and output projection share one Parameter | `wte.weight`, `lm_head.weight` |\n| SDPA | Scaled dot-product attention API | `scaled_dot_product_attention` |\n| Nats | Negative log probability with natural logarithms | Cross entropy output |\n\n## Shapes cheat sheet\n\nB=batch, T=context, D=channels, H=heads, K=D/H=head channels, V=vocabulary, L=blocks, A=accumulation.\n\n| Tensor | Named shape | Tiny | Character config | Created by |\n|---|---|---|---|---|\n| X,Y | `[B,T]` | `[2,4]` | `[64,256]` | `get_batch` |\n| Position IDs | `[T]` | `[4]` | `[256]` | `GPT.forward` |\n| Token embeddings | `[B,T,D]` | `[2,4,8]` | `[64,256,384]` | `wte` |\n| Position embeddings | `[T,D]` | `[4,8]` | `[256,384]` | `wpe` |\n| Q,K,V individually | `[B,H,T,K]` | `[2,2,4,4]` | `[64,6,256,64]` | `CausalSelfAttention.forward` |\n| Logical attention weights | `[B,H,T,T]` | `[2,2,4,4]` | `[64,6,256,256]` | Attention formula, not explicitly exposed by SDPA |\n| MLP expansion | `[B,T,4D]` | `[2,4,32]` | `[64,256,1536]` | `MLP.c_fc` |\n| Hidden states | `[B,T,D]` | `[2,4,8]` | `[64,256,384]` | Block and final norm |\n| Training logits | `[B,T,V]` | `[2,4,8]` | `[64,256,65]` | `lm_head` with targets |\n| Flattened logits | `[BT,V]` | `[8,8]` | `[16384,65]` | `GPT.forward` loss branch |\n| Inference logits | `[B,1,V]` | `[2,1,8]` | `[64,1,65]` | `lm_head` without targets |\n\n## Coverage of existing docs\n\n| Topic | Existing doc | Covered here | Note |\n|---|---|---|---|\n| `get_batch`, `block_size`, CPU settings | `README.md` quick start | train.A1, fixture settings | Source defines the exact windows |\n| `compile` | `README.md` troubleshooting | Out of scope | Disabled here |\n| `uint16` | `README.md` reproducing GPT-2 | train.A1 | Binary IDs become int64 tensors |\n| `meta.pkl` | `data/shakespeare_char/prepare.py` | train.A1 | Vocabulary metadata, not batch contents |\n| DDP | `README.md` reproducing GPT-2 | Out of scope | No distributed validation |\n| `init_from` | `README.md` finetuning | Out of scope | Random initialization only |\n| `sample.py` | `README.md` sampling / inference | Out of scope | Model's loss-free branch checked, sampler not run |\n\nThe README provides usage examples. This walkthrough uses the recorded code commit as the source of truth for behavior.\n\n## Out of scope\n\nThe `train.py` alternatives include DDP, CUDA autocast, gradient scaling, compilation, resume, and pretrained initialization. Evaluation and checkpoint storage also remain outside this measured update. `sample.py` generates text, which this walkthrough does not run. OpenWebText preprocessing, model benchmarks, notebooks, and historical speed claims remain outside the selected path.\n\nThe source checks evaluation before each update at matching iteration numbers. Checkpoint dictionaries contain model, optimizer, model arguments, iteration, best validation loss, and config. The termination check occurs after incrementing `iter_num` and uses `iter_num > max_iters`. Therefore a fresh full process with `max_iters=0` performs one update unless `eval_only=True`. These statements are source-reviewed, not process-tested.\n\n## Refreshing this doc\n\nRe-run scan_ml_repo.py, the validation command, `check_explain_doc.py --repo \"$NANO_REPO\" --mode deep`, evidence collection, and render_html.py. Compare source changes against the Commit above. Keep [evidence.json](explain.assets/evidence-1e6632ce01672421.json) and [measurement.json](explain.assets/measurement-42f16877471dcec5.json) with the Markdown. The HTML renderer loads diagram, math, and highlighting libraries from CDNs. Its generated page needs browser network access for those features.\n"}, {"name": "train.md", "title": "Training: stream windows to changed parameters", "md": "# Training: stream windows to changed parameters\n\nPaths are relative to the nanoGPT repository root. This document follows the loader and update logic. [model.md](model.md) explains the decoder and cross entropy.\n\n## Contents\n\n- [Overview](#overview)\n- [train.A Data windows](#traina-data-windows)\n- [train.B Parameter update](#trainb-parameter-update)\n- [Other paths](#other-paths)\n\n## Overview\n\n```text\nget_batch -> X,Y int64 [2,4], CPU                         # train.py train.A1\n  └─ random offsets -> windows shifted by one\nget_lr -> LR float 0.001                                 # train.py train.B1\nGPT.configure_optimizers -> AdamW, two parameter groups  # model.py train.B1\nGPT.forward -> logits [2,4,8], loss float scalar          # model.py model.A1-model.A3\n  └─ loss.backward -> parameter gradients                # train.py train.B2\nclip_grad_norm_ -> total norm and clipped gradients       # train.py train.B2\noptimizer.step -> changed parameters                     # train.py train.B2\noptimizer.zero_grad -> gradients None                    # train.py train.B2\n```\n\n| Artifact | Type / shape | Location | Sample |\n|---|---|---|---|\n| Stream | uint16 array, 12 tokens | Fixture file on local disk | `[0,1,2,3,4,5,6,7,0,1,2,3]` |\n| Batch | two int64 tensors `[2,4]` | CPU memory | First X row `[7,0,1,2]` |\n| Optimizer | AdamW with two groups | CPU process | decay=0.1 or 0.0 |\n| Gradient | one float32 tensor per Parameter | CPU memory | Token weight gradient starts `[-0.096536,0.205138,-0.069415,-0.114340]` |\n| Parameters | 888 distinct scalar parameters | CPU memory | Largest token-weight change 0.001004860 |\n\nRunning example: B=2, T=4, D=8, H=2, K=4, V=8, L=1, A=1, seed 1337. Dropout=0, bias=False, float32, CPU.\n\n## train.A Data windows\n\n### train.A1 Select shifted token windows (`train.py`)\n\n**Idea.** `get_batch` chooses independent random starts in a flat file. Targets already contain the next token at each position.\n\n**Input.** A uint16 file of 12 fixture token IDs, batch size two, and context length four.\n\n**Output.** Measured CPU int64 tensors `[B,T]=[2,4]`:\n\n```text\nX = [[7,0,1,2], [5,6,7,0]]\nY = [[0,1,2,3], [6,7,0,1]]\n```\n\n**Code.**\n\n```python\n# train.py  get_batch\nix = torch.randint(len(data) - block_size, (batch_size,))\nx = torch.stack([torch.from_numpy((data[i:i+block_size]).astype(np.int64)) for i in ix])\ny = torch.stack([torch.from_numpy((data[i+1:i+1+block_size]).astype(np.int64)) for i in ix])\nif device_type == 'cuda':\n    # pin arrays x,y, which allows us to move them to GPU asynchronously (non_blocking=True)\n    x, y = x.pin_memory().to(device, non_blocking=True), y.pin_memory().to(device, non_blocking=True)\nelse:\n    x, y = x.to(device), y.to(device)\n```\n\n`torch.randint` excludes its upper bound. A length-12 stream with T=4 permits starts 0 through 7. Start 7 gives X positions 7..10 and Y positions 8..11. Converting each slice to int64 allocates an array before stacking. CPU moves keep both tensors on CPU.\n\n**Example.** The seed samples offsets 7 and 5. Every row has four inputs and four labels. No padding token, padding mask, document boundary mask, or Dataset object appears in this loader.\n\n**Math.** `X[b,t]=stream[i_b+t]`, `Y[b,t]=stream[i_b+t+1]`. At b=0,t=0, X=stream[7]=7 and Y=stream[8]=0. Effective targets per update are BTA=2×4×1=8 on one process.\n\n**Under the hood.** Character preparation sorts the unique characters and assigns contiguous integer IDs. It splits text 90%/10% before writing uint16 files. The `meta.pkl` dictionary stores `vocab_size`, `stoi`, and `itos`. The training process reads `vocab_size` for model construction. Our fixture bypasses character preparation and sets V=8 explicitly. Original preparation requires network data, so it was source-reviewed only.\n\n**Tests.** External validation: `python tests/validate_step.py --repo \"$NANO_REPO\" --output assets/measurement.json` — **pass**. This script ships with these docs, outside the checkout. Set `NANO_REPO` to the original checkout. No upstream test suite exists at this commit.\n\nGap: sampler boundaries, the validation file branch, and actual text encoding need separate tests.\n\n## train.B Parameter update\n\n### train.B1 Set learning rate and optimizer groups (`train.py`, `model.py`)\n\n**Idea.** The loop sets one learning rate for the iteration. AdamW separates matrix parameters from vectors for weight decay.\n\n**Input.** Iteration zero, peak LR=0.004, warmup=3 updates, decay end=11, minimum LR=0.0004. The tiny model has 888 scalar parameters.\n\n**Output.** Measured LR=0.001. AdamW receives six decayed tensors containing 864 scalars and three non-decayed tensors containing 24 scalars, all in CPU memory.\n\n**Code.**\n\n```python\n# train.py  get_lr\n# 1) linear warmup for warmup_iters steps\nif it < warmup_iters:\n    return learning_rate * (it + 1) / (warmup_iters + 1)\n# 2) if it > lr_decay_iters, return min learning rate\nif it > lr_decay_iters:\n    return min_lr\n```\n\n```python\n# model.py  GPT.configure_optimizers\ndecay_params = [p for n, p in param_dict.items() if p.dim() >= 2]\nnodecay_params = [p for n, p in param_dict.items() if p.dim() < 2]\noptim_groups = [\n    {'params': decay_params, 'weight_decay': weight_decay},\n    {'params': nodecay_params, 'weight_decay': 0.0}\n]\n```\n\n```python\n# model.py  GPT.configure_optimizers\nfused_available = 'fused' in inspect.signature(torch.optim.AdamW).parameters\nuse_fused = fused_available and device_type == 'cuda'\nextra_args = dict(fused=True) if use_fused else dict()\noptimizer = torch.optim.AdamW(optim_groups, lr=learning_rate, betas=betas, **extra_args)\nprint(f\"using fused AdamW: {use_fused}\")\n```\n\nThe actual decay predicate is `p.dim() >= 2`. It includes token and position embeddings, not only matrix multiplication weights. The tied output weight appears once in named parameters. CPU chooses ordinary AdamW even when the optimizer exposes a fused option.\n\n**Example.** Measured values from the source `get_lr` function:\n\n| Iteration | LR |\n|---|---|\n| 0 | 0.001 |\n| 2 | 0.003 |\n| 3 | 0.004 |\n| 7 | 0.0022 |\n| 11 | 0.0004 |\n| 12 | 0.0004 |\n\n**Math.** Warmup returns `peak×(it+1)/(warmup+1)`. At it=0, `0.004×1/4=0.001`. Between warmup and decay end, r=(it−3)/(11−3), coefficient=(1+cos(πr))/2, LR=0.0004+coefficient×0.0036. At it=7, r=0.5 and LR=0.0022.\n\n**Tests.** External validation: `python tests/validate_step.py --repo \"$NANO_REPO\" --output assets/measurement.json` — **pass**. This script ships with these docs, outside the checkout. Set `NANO_REPO` to the original checkout. No upstream test suite exists at this commit.\n\n### train.B2 Backward, clip, update, clear (`train.py`)\n\n**Idea.** Backward writes gradients without changing parameters. The optimizer uses clipped gradients to change parameters, then the loop releases gradient storage.\n\n**Input.** Measured mean loss 2.056858 and the graph that produced it. A=1, gradient clip=1.0, LR=0.001, betas=(0.9,0.95), weight decay=0.1.\n\n**Output.** Measured CPU parameter changes. The maximum absolute token-weight change is 0.001004860. All Parameter gradients are None after clearing. Re-evaluating this same batch gives loss 2.044125.\n\n**Code.**\n\n```python\n# train.py\n    with ctx:\n        logits, loss = model(X, Y)\n        loss = loss / gradient_accumulation_steps # scale the loss to account for gradient accumulation\n    # immediately async prefetch next batch while model is doing the forward pass on the GPU\n    X, Y = get_batch('train')\n    # backward pass, with gradient scaling if training in fp16\n    scaler.scale(loss).backward()\n# clip the gradient\nif grad_clip != 0.0:\n    scaler.unscale_(optimizer)\n    torch.nn.utils.clip_grad_norm_(model.parameters(), grad_clip)\n# step the optimizer and scaler if training in fp16\nscaler.step(optimizer)\nscaler.update()\n# flush the gradients as soon as we can, no need for this memory anymore\noptimizer.zero_grad(set_to_none=True)\n```\n\nThe loss division averages accumulated micro-batches. With A=1 it leaves this loss unchanged. The source fetches new X,Y before backward. That reassignment does not change the tensors already retained by autograd. On this CPU fixture, the scaler is omitted because float32 uses no scaling.\n\n**Example.** This update produces finite gradients for every parameter. The total norm changes from 1.218671 to 0.999999. Before clipping, the first four elements of token-row-zero gradient are `[-0.096536, 0.205138, -0.069415, -0.11434]`. None represents cleared storage, not a tensor filled with zeros.\n\n```text\nBefore update: loss=2.056858, gradient norm=1.218671\nAfter clipping: gradient norm=0.999999\nAfter AdamW: maximum token-weight change=0.001004860\nAfter clearing: every parameter.grad is None\nSame-batch evaluation: loss=2.044125\n```\n\n**Math.** Cross entropy's logit gradient at one unignored position is `(p[v]−1[v=target])/(BT)`. First position, class zero: `(0.138861−1)/8≈−0.107642`. Clipping approximately multiplies all gradients by `min(1,1/1.218671)=0.820565`. PyTorch includes a small numerical stabilizer, so use the measured norm above for the exact result.\n\nAdamW maintains first and second moments in the optimizer. They are not implemented by nanoGPT. With initially zero moments, bias correction makes the first step approximately `Δw=−LR×g/(|g|+ε)−LR×decay×w`, using the clipped gradient. For LR=0.001 and decay=0.1, decay alone multiplies a matrix weight by 0.9999. The measured maximum change includes both terms. Later steps depend on moment history.\n\n**Under the hood.** The actual CPU context in `train.py` is `nullcontext()`. Setting `dtype='float32'` also disables its CUDA GradScaler. The full process includes evaluation at iteration zero before the first update. Our external script avoids those process side effects and records its narrower contract.\n\n**Tests.** External validation: `python tests/validate_step.py --repo \"$NANO_REPO\" --output assets/measurement.json` — **pass**. This script ships with these docs, outside the checkout. Set `NANO_REPO` to the original checkout. No upstream test suite exists at this commit.\n\nA lower loss on this batch verifies this tiny run. It is not evidence of generalization, stable long training, or a guarantee that every AdamW step decreases loss.\n\nGap: accumulation, a full `train.py` execution, evaluation cadence, checkpoint/resume, and mixed precision were not run.\n\n## Other paths\n\n| Switch | Golden path | Alternative | Validation |\n|---|---|---|---|\n| `init_from` | Random tiny initialization | resume or `gpt2*` loading | Not run |\n| `decay_lr` | Source warmup/cosine | Fixed LR | Schedule sampled, fixed LR not tested |\n| `gradient_accumulation_steps` | 1 | Multiple micro-batches | Not run |\n| `RANK` environment | Single process | DDP synchronizes last accumulated backward | Not run |\n| `device`, `dtype` | CPU float32 | CUDA AMP and scaler | Not run |\n| `compile` | False | `torch.compile` before DDP wrapping | Not run |\n\nThe repository's `train.py` defaults differ from `GPTConfig`: the script sets `bias=False`, while the dataclass defaults to True. The fixture deliberately uses the script's value. [model.md](model.md) covers the attention API switch and inference head branch.\n"}, {"name": "model.md", "title": "Model: token IDs to eight next-token predictions", "md": "# Model: token IDs to eight next-token predictions\n\nPaths are relative to the nanoGPT repository root. This document explains the model math. [train.md](train.md) follows file loading and the parameter update.\n\n## Contents\n\n- [Architecture](#architecture)\n- [model.A Forward and loss](#modela-forward-and-loss)\n- [Parameters and alternatives](#parameters-and-alternatives)\n\n## Architecture\n\n| Input channel | Tiny shape | Used? | Switch / owner |\n|---|---|---|---|\n| `idx` | int64 `[B,T]=[2,4]` | Yes | Required argument to `GPT.forward` |\n| `targets` | int64 `[B,T]=[2,4]` | Yes | Non-None enables all-position logits and loss |\n| Positions | int64 `[T]=[4]` | Yes | Constructed inside forward, learned `wpe` embeddings |\n| External masks, cache, side inputs | None | Absent | Not arguments to this forward |\n\n```mermaid\nflowchart TB\n    ids[\"idx [B,T]=[2,4]\"] -->|\"[2,4]\"| tokens[\"Token embedding\"]\n    pos[\"Positions [T]=[4]\"] -->|\"[4]\"| positions[\"Position embedding\"]\n    tokens -->|\"[B,T,D]=[2,4,8]\"| combine[\"Add then dropout\"]\n    positions -->|\"[T,D]=[4,8], broadcast B\"| combine\n    combine -->|\"[2,4,8]\"| normone[\"LayerNorm 1\"]\n    combine -->|\"residual [2,4,8]\"| addone[\"Add attention residual\"]\n    normone -->|\"[2,4,8]\"| attn[\"QKV, two causal heads, projection\"]\n    attn -->|\"[2,4,8]\"| addone\n    addone -->|\"[2,4,8]\"| normtwo[\"LayerNorm 2\"]\n    addone -->|\"residual [2,4,8]\"| addtwo[\"Add MLP residual\"]\n    normtwo -->|\"[2,4,8]\"| mlp[\"Linear 8 to 32, GELU, Linear 32 to 8\"]\n    mlp -->|\"[2,4,8]\"| addtwo\n    addtwo -->|\"one block here, L times generally\"| finalnorm[\"Final LayerNorm\"]\n    finalnorm -->|\"[2,4,8]\"| head[\"Tied vocabulary head\"]\n    head -->|\"[B,T,V]=[2,4,8]\"| loss[\"Flatten and cross entropy\"]\n    targets[\"targets [2,4]\"] -->|\"labels [BT]=[8]\"| loss\n    loss -->|\"scalar\"| output[\"Mean loss\"]\n```\n\nThe residual section is one block, repeated L times. Tensor edges describe data dependencies, not distinct allocations.\n\n```text\nidx int64 [2,4]\n  -> token embedding float32 [2,4,8]\npositions int64 [4] -> position embedding [4,8]\n  -> sum, broadcast across batch [2,4,8]\n  -> LayerNorm -> QKV [2,4,24]\n  -> Q,K,V each [2,2,4,4]\n  -> causal attention, join heads [2,4,8]\n  -> projection, residual add [2,4,8]\n  -> LayerNorm -> Linear [2,4,32] -> GELU -> Linear [2,4,8]\n  -> residual add -> final LayerNorm [2,4,8]\n  -> tied Linear [2,4,8] -> flatten logits [8,8], labels [8]\n  -> scalar cross entropy\n```\n\nDimensions: B=2 windows, T=4 positions, D=8 channels, H=2 heads, K=D/H=4 channels per head, V=8 token classes, L=1 block. The character config has B=64,T=256,D=384,H=6,K=64,L=6, and original prepared V=65.\n\n## model.A Forward and loss\n\n### model.A1 Embed tokens and positions (`model.py`)\n\n**Idea.** Token embeddings identify token classes. Position embeddings identify locations within each sampled window.\n\n**Input.** X=`[[7, 0, 1, 2], [5, 6, 7, 0]]` on CPU. Position IDs reset to `[0,1,2,3]` for both windows.\n\n**Output.** Float32 CPU sum `[B,T,D]=[2,4,8]`. Measured first vector, rounded:\n\n```text\n[0.010869,-0.020151,0.004939,0.011523,0.019955,0.040634,-0.014433,-0.034709]\n```\n\n**Code.**\n\n```python\n# model.py  GPT.forward\ndevice = idx.device\nb, t = idx.size()\nassert t <= self.config.block_size, f\"Cannot forward sequence of length {t}, block size is only {self.config.block_size}\"\npos = torch.arange(0, t, dtype=torch.long, device=device) # shape (t)\n\n# forward the GPT model itself\ntok_emb = self.transformer.wte(idx) # token embeddings of shape (b, t, n_embd)\npos_emb = self.transformer.wpe(pos) # position embeddings of shape (t, n_embd)\nx = self.transformer.drop(tok_emb + pos_emb)\n```\n\n```python\n# model.py  GPT.__init__\nself.lm_head = nn.Linear(config.n_embd, config.vocab_size, bias=False)\n# with weight tying when using torch.compile() some warnings get generated:\n# \"UserWarning: functional_call was passed multiple values for tied weights.\n# This behavior is deprecated and will be an error in future versions\"\n# not 100% sure what this is, so far seems to be harmless. TODO investigate\nself.transformer.wte.weight = self.lm_head.weight # https://paperswithcode.com/method/weight-tying\n```\n\nThe embedding tables have shapes `[V,D]=[8,8]` and `[block_size,D]=[4,8]`. Position lookup produces `[4,8]`, which broadcasts over B. Token embedding and vocabulary projection share the same Parameter. The assertion limits T to configured context length.\n\n**Example.** At position zero in the first window, the input class is 7. The model adds row 7 of the token table to row 0 of the position table. Dropout=0 leaves the sum unchanged.\n\n**Math.** `h[b,t,d]=W_token[X[b,t],d]+W_position[t,d]`. The first result component is measured as 0.010869. LayerNorm later transforms the whole eight-component vector, not each component independently.\n\n**Tests.** External validation: `python tests/validate_step.py --repo \"$NANO_REPO\" --output assets/measurement.json` — **pass**. This script ships with these docs, outside the checkout. Set `NANO_REPO` to the original checkout. No upstream test suite exists at this commit.\n\n### model.A2 Apply one causal decoder block (`model.py`)\n\n**Idea.** Attention combines information from allowed input positions. The MLP transforms channels independently at each position. Residual additions preserve a direct path around both transformations.\n\n**Input.** Float32 CPU embeddings `[2,4,8]` from model.A1.\n\n**Output.** Float32 CPU hidden states `[2,4,8]` after the block and final normalization. Measured first final vector:\n\n```text\n[0.411401,-0.900618,0.089378,0.389201,0.718212,1.671423,-0.662723,-1.716273]\n```\n\n**Code.**\n\n```python\n# model.py  Block\ndef forward(self, x):\n    x = x + self.attn(self.ln_1(x))\n    x = x + self.mlp(self.ln_2(x))\n    return x\n```\n\n```python\n# model.py  CausalSelfAttention.forward\n# calculate query, key, values for all heads in batch and move head forward to be the batch dim\nq, k, v  = self.c_attn(x).split(self.n_embd, dim=2)\nk = k.view(B, T, self.n_head, C // self.n_head).transpose(1, 2) # (B, nh, T, hs)\nq = q.view(B, T, self.n_head, C // self.n_head).transpose(1, 2) # (B, nh, T, hs)\nv = v.view(B, T, self.n_head, C // self.n_head).transpose(1, 2) # (B, nh, T, hs)\n\n# causal self-attention; Self-attend: (B, nh, T, hs) x (B, nh, hs, T) -> (B, nh, T, T)\nif self.flash:\n    # efficient attention using Flash Attention CUDA kernels\n    y = torch.nn.functional.scaled_dot_product_attention(q, k, v, attn_mask=None, dropout_p=self.dropout if self.training else 0, is_causal=True)\n```\n\n```python\n# model.py  MLP\ndef forward(self, x):\n    x = self.c_fc(x)\n    x = self.gelu(x)\n    x = self.c_proj(x)\n    x = self.dropout(x)\n    return x\n```\n\n```python\n# model.py  LayerNorm\ndef forward(self, input):\n    return F.layer_norm(input, self.weight.shape, self.weight, self.bias, 1e-5)\n```\n\n**Example.** For batch zero, head zero, the explicit reconstruction of the causal attention probabilities is:\n\n```text\n[[1.000000,0.000000,0.000000,0.000000],\n [0.498675,0.501325,0.000000,0.000000],\n [0.333437,0.332668,0.333895,0.000000],\n [0.251132,0.251014,0.249757,0.248097]]\n```\n\nThese are measured from the same projections and mask formula. The SDPA call itself returns attention outputs, not this matrix. The reconstruction is not a hook into internal SDPA weights.\n\n![Causal attention probabilities](data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA5MDAgNTcwIiByb2xlPSJpbWciIGFyaWEtbGFiZWw9IkNhdXNhbCBhdHRlbnRpb246IGFsbG93ZWQgcHJlZml4IG9ubHkiPjxzdHlsZT50ZXh0e2ZvbnQtZmFtaWx5OnN5c3RlbS11aSxzYW5zLXNlcmlmO2ZpbGw6IzE4MjQzYztmb250LXNpemU6MTlweH0gLnNtYWxse2ZvbnQtc2l6ZToxN3B4fSAubW9ub3tmb250LWZhbWlseTptb25vc3BhY2V9PC9zdHlsZT48cmVjdCB3aWR0aD0iOTAwIiBoZWlnaHQ9IjU3MCIgZmlsbD0id2hpdGUiLz48dGV4dCB4PSIzMCIgeT0iMzUiIGZvbnQtd2VpZ2h0PSI3MDAiPkNhdXNhbCBhdHRlbnRpb246IGFsbG93ZWQgcHJlZml4IG9ubHk8L3RleHQ+PHRleHQgeD0iMzAiIHk9Ijc1IiBjbGFzcz0ic21hbGwiPkJhdGNoIDAsIGhlYWQgMC4gUmVjb25zdHJ1Y3RlZCBmcm9tIFEvSywgY2F1c2FsIG1hc2sgYW5kIHNvZnRtYXguPC90ZXh0Pjx0ZXh0IHg9IjI2MCIgeT0iMTIwIj5LZXkgcG9zaXRpb248L3Rle computes `Linear(GELU(Linear(z)))`: D=8 expands to 4D=32 and contracts to eight. GELU's default exact function is `z×Φ(z)`. At z=0 it returns zero. With dropout=0, both residual branches keep their full outputs.\n\n**Under the hood.** The field named `flash` tests whether PyTorch exposes the SDPA API. It does not test CUDA availability. This CPU run uses that API. The source comment about CUDA Flash Attention does not establish that a GPU kernel ran. Python loops over L blocks, and this model stores no reusable KV cache.\n\n**Tests.** External validation: `python tests/validate_step.py --repo \"$NANO_REPO\" --output assets/measurement.json` — **pass**. This script ships with these docs, outside the checkout. Set `NANO_REPO` to the original checkout. No upstream test suite exists at this commit.\n\nThe causal test changes the final input token and compares all earlier logits. It passed within rtol=1e−5, atol=1e−6. This checks end-to-end future-token isolation. It does not prove every mask edge or the older manual branch.\n\n### model.A3 Project vocabulary logits and compute loss (`model.py`)\n\n**Idea.** The tied vocabulary head scores all eight possible next tokens. Targets select one correct class at each position.\n\n**Input.** Hidden states `[2,4,8]` and Y=`[[0, 1, 2, 3], [6, 7, 0, 1]]`, all on CPU.\n\n**Output.** Float32 CPU logits `[B,T,V]=[2,4,8]` and scalar mean loss 2.056858 nats. First probability vector, measured:\n\n```text\n[0.138861,0.124204,0.115447,0.133548,0.127327,0.114259,0.117764,0.128590]\n```\n\n**Code.**\n\n```python\n# model.py  GPT.forward\nif targets is not None:\n    # if we are given some desired targets also calculate the loss\n    logits = self.lm_head(x)\n    loss = F.cross_entropy(logits.view(-1, logits.size(-1)), targets.view(-1), ignore_index=-1)\nelse:\n    # inference-time mini-optimization: only forward the lm_head on the very last position\n    logits = self.lm_head(x[:, [-1], :]) # note: using list [-1] to preserve the time dim\n    loss = None\n\nreturn logits, loss\n```\n\nFlattening combines B and T while preserving V. Cross entropy receives eight rows of eight logits and eight labels. `ignore_index=-1` can exclude target positions. Our fixture has no ignored positions. The loader's uint16 IDs cannot represent −1 directly.\n\n**Example.** Position `[0,0]` predicts class zero. Its probability is 0.138861, so its error is `−log(0.138861)=1.974284` nats. All measured per-position errors are:\n\n```text\n[[1.974284,2.007585,2.104710,2.133002],\n [2.076542,2.093054,2.034803,2.030884]]\n```\n\n**Math.** For logits z, `p[v]=exp(z[v])/sum_j exp(z[j])`. Mean loss is `sum_valid −log(p[target])/number_valid`. Here the eight errors sum to approximately 16.454864, and dividing by eight gives 2.056858. The implementation passes logits directly to cross entropy. It does not first call softmax.\n\n**Under the hood.** Without targets, the model still computes the hidden sequence but projects only `x[:,[-1],:]`. The list index preserves T=1, yielding logits `[2,1,8]` and loss=None. The validation checked this branch. Token sampling in `sample.py` was not run.\n\n**Tests.** External validation: `python tests/validate_step.py --repo \"$NANO_REPO\" --output assets/measurement.json` — **pass**. This script ships with these docs, outside the checkout. Set `NANO_REPO` to the original checkout. No upstream test suite exists at this commit.\n\nGap: ignored-target behavior and all-ignored targets need explicit validation.\n\n## Parameters and alternatives\n\nFor bias=False and this architecture, scalar parameter count is `VD+TD+L(12D²+2D)+D`. VD is the tied token/head matrix. TD is learned positions. A block has 3D² QKV weights, D² attention projection weights, 8D² MLP weights, and 2D norm scales. The final norm adds D.\n\nTiny count: `8×8+4×8+1×(12×8²+2×8)+8=888`, matching measurement. `GPT.get_num_params()` excludes position embeddings by default, so its reported non-position count is 856. Weight sharing prevents another VD term.\n\n| Choice | Source selector | Golden path | Alternative / gap |\n|---|---|---|---|\n| Attention | `CausalSelfAttention.flash` | SDPA API present, CPU | Manual lower-triangular mask when API absent, not run |\n| Head branch | `targets is not None` | All-position logits and CE | Final-position logits with no loss, shape checked |\n| Bias | `GPTConfig.bias` | False override | True dataclass default, not run |\n| Dropout | `config.dropout`, module training state | Zero | Nonzero training dropout, not run |\n\nThe model uses learned absolute positions and pre-normalized residual blocks. It has no rotary positions, gated MLP, RMSNorm, or persistent KV-cache interface. These distinctions follow the actual modules and forward arguments.\n"}]</script>

<script>
(function () {
  const DOCS = JSON.parse(document.getElementById("docs-data").textContent);
  const NAMES = DOCS.map(d => d.name);
  const esc = s => s.replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
  const plain = s => s.replace(/`/g, "").replace(/\*\*|__/g, "").replace(/\[([^\]]*)\]\([^)]*\)/g, "$1");

  // GitHub-style slugs, so links written for GitHub/Cursor preview resolve here.
  function makeSlugger() {
    const seen = {};
    return function (text) {
      let s = plain(text).trim().toLowerCase().replace(/[^\p{L}\p{N}_\- ]/gu, "").replace(/ /g, "-");
      if (seen[s] !== undefined) { seen[s] += 1; s = s + "-" + seen[s]; } else { seen[s] = 0; }
      return s;
    };
  }

  function headingsOf(md) {
    const slug = makeSlugger(), out = [];
    for (const t of marked.lexer(md)) {
      if (t.type === "heading" && t.depth <= 3) out.push({depth: t.depth, text: plain(t.text), id: slug(t.text)});
    }
    return out;
  }
  DOCS.forEach(d => { d.headings = headingsOf(d.md); });

  function katexRender(tex, display) {
    try { return katex.renderToString(tex, {displayMode: display, throwOnError: false}); }
    catch (e) { return "<code>" + esc(tex) + "</code>"; }
  }
  const mathBlock = {
    name: "mathBlock", level: "block",
    start(src) { const m = src.match(/(^|\n)[ \t]*(\\\[|\$\$)/); return m ? m.index + m[1].length : undefined; },
    tokenizer(src) {
      const m = /^[ \t]*(?:\\\[([\s\S]+?)\\\]|\$\$([\s\S]+?)\$\$)[ \t]*(?:\n|$)/.exec(src);
      if (m) return {type: "mathBlock", raw: m[0], text: (m[1] || m[2]).trim()};
    },
    renderer(t) { return '<div class="math-block">' + katexRender(t.text, true) + "</div>"; }
  };
  const mathInline = {
    name: "mathInline", level: "inline",
    start(src) { const m = src.match(/\\\(|\\\[/); return m ? m.index : undefined; },
    tokenizer(src) {
      let m = /^\\\(([\s\S]+?)\\\)/.exec(src);
      if (m) return {type: "mathInline", raw: m[0], text: m[1], display: false};
      m = /^\\\[([\s\S]+?)\\\]/.exec(src);
      if (m) return {type: "mathInline", raw: m[0], text: m[1], display: true};
    },
    renderer(t) { return katexRender(t.text, t.display); }
  };

  let slug = makeSlugger();
  const renderer = {
    heading(text, level, raw) {
      const id = slug(raw);
      return "<h" + level + ' id="' + id + '">' + text + "</h" + level + ">\n";
    },
    code(code, info) {
      const lang = (info || "").trim().split(/\s+/)[0];
      if (lang === "mermaid") return '<div class="mermaid">' + esc(code) + "</div>";
      let html;
      if (lang && hljs.getLanguage(lang)) html = hljs.highlight(code, {language: lang}).value;
      else html = esc(code);
      return '<pre><button class="copy">copy</button><code class="hljs">' + html + "</code></pre>";
    },
    table(header, body) {
      return '<div class="table-wrap"><table><thead>' + header + "</thead><tbody>" + body + "</tbody></table></div>";
    },
    link(href, title, text) {
      const m = /^(?:\.\/)?([\w.\-\/]+\.md)(#.*)?$/.exec(href || "");
      if (m) {
        const name = m[1].split("/").pop();
        if (NAMES.includes(name)) href = "#/" + name + (m[2] || "");
      }
      const ext = /^https?:/.test(href || "") ? ' target="_blank" rel="noopener"' : "";
      return '<a href="' + esc(href || "") + '"' + (title ? ' title="' + esc(title) + '"' : "") + ext + ">" + text + "</a>";
    }
  };
  marked.use({gfm: true, extensions: [mathBlock, mathInline], renderer});
  mermaid.initialize({startOnLoad: false, securityLevel: "strict"});

  // One diagram at a time, so a broken diagram shows its own error and source
  // in place and the others still render. window.explainDiagramErrors and the
  // page title report the count, for a quick check after rendering.
  let renderSeq = 0;
  async function renderDiagrams(el, doc) {
    const nodes = [...el.querySelectorAll(".mermaid")];
    let errors = 0;
    for (const n of nodes) {
      const src = n.textContent, id = "mmd-" + (++renderSeq);
      try {
        const out = await mermaid.render(id, src);
        n.innerHTML = out.svg;
      } catch (err) {
        errors += 1;
        const stray = document.getElementById("d" + id) || document.getElementById(id);
        if (stray && !el.contains(stray)) stray.remove();
        n.classList.add("mermaid-failed");
        n.innerHTML = '<div class="mermaid-error">Diagram error: ' +
          esc(String(err && err.message ? err.message : err)) + "</div><pre>" + esc(src) + "</pre>";
      }
    }
    window.explainDiagramErrors = errors;
    document.title = (errors ? "[" + errors + " diagram error" + (errors > 1 ? "s" : "") + "] " : "") + doc.title;
  }

  function tocMarkdown(doc) {
    return doc.headings.filter(h => h.depth >= 2).map(h =>
      "  ".repeat(h.depth - 2) + "- [" + h.text.replace(/[\[\]]/g, "") + "](#/" + doc.name + "#" + h.id + ")").join("\n");
  }

  function render(name, anchor) {
    const doc = DOCS.find(d => d.name === name) || DOCS[0];
    let md = doc.md.replace(/^\s*(\[TOC\]|\[\[_TOC_\]\])\s*$/gm, () => tocMarkdown(doc));
    slug = makeSlugger();
    const el = document.getElementById("content");
    el.innerHTML = marked.parse(md);
    el.querySelectorAll("pre .copy").forEach(b => b.addEventListener("click", () => {
      navigator.clipboard.writeText(b.nextElementSibling.innerText);
      b.textContent = "copied"; setTimeout(() => { b.textContent = "copy"; }, 1200);
    }));
    renderDiagrams(el, doc);
    const i = DOCS.indexOf(doc), prev = DOCS[i - 1], next = DOCS[i + 1];
    document.getElementById("pager").innerHTML =
      (prev ? '<a href="#/' + prev.name + '">&larr; ' + esc(prev.title) + "</a>" : "<span></span>") +
      (next ? '<a href="#/' + next.name + '">' + esc(next.title) + " &rarr;</a>" : "<span></span>");
    if (!el.querySelector(".mermaid")) document.title = doc.title;
    buildNav(doc.name, "");
    if (anchor) { const t = document.getElementById(decodeURIComponent(anchor)); if (t) { t.scrollIntoView(); return; } }
    window.scrollTo(0, 0);
  }

  function buildNav(active, query) {
    const nav = document.getElementById("nav");
    const q = query.trim().toLowerCase();
    let html = "";
    if (q) {
      for (const d of DOCS) {
        for (const h of d.headings) if (h.text.toLowerCase().includes(q))
          html += '<a class="h2 hit" href="#/' + d.name + "#" + h.id + '">' + esc(h.text) + " <small>" + esc(d.name) + "</small></a>";
        const n = d.md.toLowerCase().split(q).length - 1;
        if (n) html += '<a class="doc" href="#/' + d.name + '">' + esc(d.title) + " <small>(" + n + " text matches)</small></a>";
      }
      nav.innerHTML = html || "<small>No matches</small>";
      return;
    }
    for (const d of DOCS) {
      html += '<a class="doc' + (d.name === active ? " active" : "") + '" href="#/' + d.name + '">' + esc(d.title) + "</a>";
      if (d.name === active)
        for (const h of d.headings) if (h.depth >= 2)
          html += '<a class="h' + h.depth + '" href="#/' + d.name + "#" + h.id + '" title="' + esc(h.text) + '">' + esc(h.text) + "</a>";
    }
    nav.innerHTML = html;
  }

  function route() {
    const h = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
    const cut = h.indexOf("#");
    const name = cut < 0 ? h : h.slice(0, cut), anchor = cut < 0 ? "" : h.slice(cut + 1);
    render(name || DOCS[0].name, anchor);
  }
  document.getElementById("search").addEventListener("input", e => {
    const cur = (location.hash.replace(/^#\/?/, "").split("#")[0]) || DOCS[0].name;
    buildNav(cur, e.target.value);
  });
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
